<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel">
<title>Family Travel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:17px;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f0eb;overscroll-behavior:none;}
.fscreen{position:fixed;inset:0;background:linear-gradient(160deg,#1a6b8a,#0d4f6b,#0a3d54);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000;padding:2rem;}
.fscreen.hide{display:none;}
.fscreen-wave{font-size:3rem;margin-bottom:1rem;}
.fscreen-title{font-size:1.4rem;font-weight:700;color:white;margin-bottom:0.3rem;}
.fscreen-sub{font-size:0.75rem;color:rgba(255,255,255,0.65);margin-bottom:2rem;}
.fscreen-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;max-width:22rem;}
.ftile{display:flex;flex-direction:column;align-items:center;gap:0.5rem;
  padding:1.5rem 1rem;border-radius:1rem;border:2px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.1);cursor:pointer;backdrop-filter:blur(8px);}
.ftile:active{background:rgba(255,255,255,0.25);}
.ftile-ico{font-size:2rem;}.ftile-name{font-size:0.95rem;font-weight:600;color:white;}
.ftile-members{font-size:0.6rem;color:rgba(255,255,255,0.65);text-align:center;line-height:1.4;}
.lscreen{position:fixed;inset:0;background:linear-gradient(160deg,#1a6b8a,#0a3d54);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8000;}
.lscreen.hide{display:none;}
.lscreen-ico{font-size:3rem;margin-bottom:1rem;}
.lscreen-txt{font-size:0.9rem;color:rgba(255,255,255,0.8);font-weight:500;margin-bottom:1rem;}
.ldbg{background:rgba(0,0,0,0.4);border-radius:0.75rem;padding:0.75rem 1rem;
  width:min(90vw,22rem);max-height:50vh;overflow-y:auto;font-family:monospace;
  font-size:0.7rem;color:#90EE90;display:none;text-align:left;}
.ldbg.show{display:block;}
#app{display:none;}
.hero{background:#87CEEB;padding:0.75rem 0.9rem 4.2rem;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1.6rem;
  background:#f2f0eb;clip-path:ellipse(55% 100% at 50% 100%);}
.hero-sun{position:absolute;top:0.5rem;right:0.5rem;width:2rem;height:2rem;border-radius:50%;
  background:radial-gradient(circle,#FFE566 40%,#FFD700 70%,transparent 100%);pointer-events:none;z-index:0;}
.hero-row{display:flex;align-items:center;gap:0.5rem;position:relative;z-index:1;}
.hero-emoji{font-size:2.6rem;line-height:1;flex-shrink:0;}
.hero-txt{flex:1;}
.hero-badge{display:inline-flex;align-items:center;gap:0.3rem;background:rgba(0,43,92,0.18);
  border-radius:99px;padding:0.15rem 0.5rem;font-size:0.58rem;font-weight:600;color:#002B5C;cursor:pointer;margin-bottom:0.15rem;}
.hero-title{font-size:0.95rem;font-weight:700;color:#002B5C;}
.hero-sub{font-size:0.58rem;color:#003A7A;margin-top:0.1rem;}
.prog-row{display:flex;align-items:center;gap:0.5rem;margin-top:0.55rem;position:relative;z-index:1;}
.pw{flex:1;background:rgba(0,43,92,0.15);border-radius:99px;height:0.4rem;}
.pb{background:#FFD700;border-radius:99px;height:0.4rem;transition:width 0.4s;}
.pl{font-size:0.55rem;color:#002B5C;font-weight:600;margin-top:0.2rem;}
.newtrip-btn{display:flex;align-items:center;gap:0.2rem;padding:0.28rem 0.55rem;
  border-radius:0.5rem;border:1.5px solid rgba(0,43,92,0.35);background:rgba(255,255,255,0.45);
  font-size:0.58rem;color:#002B5C;cursor:pointer;flex-shrink:0;font-weight:600;}
.newtrip-btn:active{background:rgba(255,255,255,0.7);}
.sdot{width:0.45rem;height:0.45rem;border-radius:50%;background:rgba(0,43,92,0.28);
  display:inline-block;margin-left:0.3rem;transition:background 0.3s;flex-shrink:0;}
.sdot.saving{background:#FFD700;}.sdot.err{background:#E53935;}
.hero-beach{position:absolute;bottom:0.6rem;left:0;right:0;width:100%;height:2.8rem;pointer-events:none;}
.toolbar{background:white;padding:0.45rem 0.7rem;border-bottom:1px solid #e4e0d8;
  display:flex;align-items:center;gap:0.3rem;overflow-x:auto;}
.ulbl{font-size:0.58rem;color:#999;white-space:nowrap;flex-shrink:0;}
.ubtn{display:flex;align-items:center;gap:0.22rem;padding:0.3rem 0.55rem;border-radius:99px;
  border:1.5px solid transparent;font-size:0.62rem;cursor:pointer;background:transparent;flex-shrink:0;white-space:nowrap;}
.ubtn.active{font-weight:600;}
.udot{width:0.4rem;height:0.4rem;border-radius:50%;flex-shrink:0;}
.pencilbtn{background:none;border:none;cursor:pointer;font-size:0.95rem;color:#bbb;padding:0.2rem;}
.nav{display:flex;border-bottom:2px solid #ddd8cc;background:#f2f0eb;}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.1rem;
  padding:0.5rem 0.2rem 0.55rem;border:none;cursor:pointer;background:transparent;
  border-top:3px solid transparent;border-right:1px solid #e0d8c8;}
.ntab:last-child{border-right:none;}
.ntab.active{background:white;}
.ntab.active.t-ryan{border-top-color:#7F77DD;}
.ntab.active.t-family{border-top-color:#1D9E75;}
.ntab.active.t-flight{border-top-color:#378ADD;}
.ntab.active.t-hotel{border-top-color:#D85A30;}
.ntab.active.t-reserve{border-top-color:#9B59B6;}
.ntab-ico{font-size:1.1rem;line-height:1;}
.ntab-lbl{font-size:0.5rem;font-weight:600;color:#777;white-space:nowrap;}
.ntab.active .ntab-lbl{color:#222;}
.ntab-cnt{font-size:0.44rem;padding:0.04rem 0.28rem;border-radius:99px;background:#e0d8c8;color:#555;}
.ntab.active.t-ryan .ntab-cnt{background:#CECBF6;color:#3C3489;}
.ntab.active.t-family .ntab-cnt{background:#9FE1CB;color:#085041;}
.ntab.active.t-flight .ntab-cnt{background:#B5D4F4;color:#0C447C;}
.ntab.active.t-hotel .ntab-cnt{background:#F5C4B3;color:#712B13;}
.ntab.active.t-reserve .ntab-cnt{background:#E8C8F8;color:#6B2F9E;}
.ddwrap{position:relative;width:100%;}
.ddsel{width:100%;background:white;border:none;border-bottom:2px solid #e0d8c8;
  padding:0.55rem 0.85rem;font-size:0.82rem;font-weight:600;color:#111;
  display:flex;align-items:center;gap:0.5rem;cursor:pointer;}
.ddsel-ico{font-size:0.95rem;}.ddsel-lbl{flex:1;text-align:left;}
.ddsel-cnt{font-size:0.58rem;padding:0.08rem 0.38rem;border-radius:99px;background:#CECBF6;color:#3C3489;}
.ddsel-cnt.fam{background:#9FE1CB;color:#085041;}
.ddarrow{font-size:0.75rem;color:#aaa;transition:transform 0.18s;}
.ddarrow.open{transform:rotate(180deg);}
.ddmenu{position:absolute;top:100%;left:0;right:0;background:white;
  border:1px solid #e0d8c8;border-top:none;border-radius:0 0 0.6rem 0.6rem;
  z-index:400;box-shadow:0 6px 20px rgba(0,0,0,0.12);display:none;overflow:hidden;}
.ddmenu.open{display:block;}
.dditem{display:flex;align-items:center;gap:0.5rem;padding:0.7rem 0.85rem;
  cursor:pointer;font-size:0.78rem;color:#111;border-bottom:0.5px solid #f0ede6;}
.dditem:last-child{border-bottom:none;}
.dditem:active{background:#f5f0e8;}
.dditem.sel{background:#EEEDFE;color:#3C3489;font-weight:600;}
.dditem.sel.fam{background:#E1F5EE;color:#085041;}
.dditem-ico{font-size:1rem;}
.dditem-cnt{margin-left:auto;font-size:0.55rem;padding:0.06rem 0.35rem;border-radius:99px;background:#e8e4dc;color:#555;}
.ph{display:flex;align-items:center;gap:0.5rem;padding:0.6rem 0.85rem;border-bottom:2px solid transparent;}
.ph.ryan{background:#DAEEF9;border-color:#7F77DD;}
.ph.family{background:#E1F5EE;border-color:#1D9E75;}
.ph.flight{background:#E6F1FB;border-color:#378ADD;}
.ph.hotel{background:#FAECE7;border-color:#D85A30;}
.ph.reserve{background:#F3E8FD;border-color:#9B59B6;}
.ph-title{font-size:0.82rem;font-weight:600;flex:1;color:#111;}
.ph-cnt{font-size:0.6rem;padding:0.1rem 0.45rem;border-radius:99px;}
.ph-add{display:flex;align-items:center;gap:0.2rem;padding:0.28rem 0.6rem;
  border-radius:0.5rem;border:none;font-size:0.62rem;font-weight:600;cursor:pointer;color:white;}
.ph-add:active{opacity:0.82;}
.ph-add.ryan{background:#7F77DD;}.ph-add.family{background:#1D9E75;}
.ph-add.flight{background:#378ADD;}.ph-add.hotel{background:#D85A30;}
.ph-add.reserve{background:#9B59B6;}
.ilist{list-style:none;background:white;}
.irow{display:flex;align-items:center;gap:0.38rem;padding:0.65rem 0.85rem;
  border-bottom:0.5px solid rgba(0,0,0,0.06);min-height:2.6rem;}
.irow:last-child{border-bottom:none;}
.irow.done{opacity:0.48;}
.irow.skip{background:repeating-linear-gradient(90deg,transparent,transparent 8px,rgba(0,0,0,0.02) 8px,rgba(0,0,0,0.02) 9px);}
.ichk{width:1.3rem;height:1.3rem;border-radius:50%;border:1.5px solid #b0c8b0;
  background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:0.7rem;flex-shrink:0;color:transparent;}
.ichk.on{background:#1D9E75;border-color:#1D9E75;color:white;}
.itxt{flex:1;font-size:0.76rem;color:#111;min-width:0;line-height:1.35;}
.itxt.struck{text-decoration:line-through;color:#bbb;}
.itxt.skp{font-style:italic;color:#b0a070;}
.iundo{font-size:0.56rem;color:#1D9E75;cursor:pointer;text-decoration:underline;margin-top:0.1rem;display:block;}
.istamp{font-size:0.5rem;padding:0.08rem 0.38rem;border-radius:99px;font-weight:600;flex-shrink:0;}
.iskip{font-size:0.48rem;padding:0.08rem 0.35rem;border-radius:0.25rem;
  background:rgba(0,0,0,0.07);color:#8a7040;font-style:italic;border:1px dashed #c0a868;flex-shrink:0;}
.idot{background:none;border:none;cursor:pointer;font-size:0.9rem;color:#c0a878;
  padding:0.1rem 0.15rem;flex-shrink:0;min-width:1.6rem;min-height:1.6rem;
  display:flex;align-items:center;justify-content:center;}
.idot:active{background:#f5f0e8;}
.empty{padding:2rem 1.5rem;text-align:center;color:#aaa;font-size:0.75rem;}
.cards{display:flex;flex-direction:column;}
.card{background:white;border-bottom:1px solid #ece8e0;padding:0.8rem;cursor:pointer;position:relative;}
.card:active{background:#faf8f4;}.card.past{opacity:0.5;}
.card-title{font-size:0.82rem;font-weight:600;color:#111;margin-bottom:0.18rem;}
.card-sub{font-size:0.62rem;color:#666;line-height:1.4;}
.card-chev{position:absolute;right:0.7rem;top:50%;transform:translateY(-50%);font-size:0.8rem;color:#ccc;}
.pill{display:inline-block;font-size:0.5rem;font-weight:600;padding:0.08rem 0.35rem;border-radius:99px;margin-right:0.2rem;}
.pill.fl{background:#B5D4F4;color:#0C447C;}.pill.ht{background:#F5C4B3;color:#712B13;}
.pill.rs{background:#E8C8F8;color:#6B2F9E;}.pill.pt{background:#f0e8d0;color:#8a6020;}
.sec-sep{padding:0.35rem 0.85rem;background:#f2f0eb;font-size:0.52rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.05em;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:500;}
.overlay.open{display:block;}
.cpanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:white;border-radius:1rem;width:min(92vw,26rem);max-height:82vh;
  overflow-y:auto;z-index:600;display:none;box-shadow:0 8px 40px rgba(0,0,0,0.22);}
.cpanel.open{display:block;}
.cp-head{display:flex;align-items:center;gap:0.5rem;padding:0.9rem 1rem 0.7rem;
  border-bottom:1px solid #ece8e0;position:sticky;top:0;background:white;z-index:1;}
.cp-title{font-size:0.88rem;font-weight:600;flex:1;color:#111;}
.cp-close{background:none;border:none;font-size:1.2rem;color:#aaa;cursor:pointer;}
.cp-body{padding:0.8rem 1rem 1.2rem;}
.fsec{margin-bottom:0.9rem;}
.flbl{font-size:0.58rem;font-weight:700;color:#888;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.25rem;display:block;}
.finp{width:100%;border:1.5px solid #e0d8c8;border-radius:0.5rem;padding:0.5rem 0.6rem;
  font-size:0.82rem;background:#faf9f6;-webkit-appearance:none;outline:none;font-family:inherit;color:#111;}
.finp:focus{border-color:#378ADD;background:white;}
.fta{resize:none;min-height:3rem;line-height:1.4;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0.45rem;}
.ftog{display:flex;border:1.5px solid #e0d8c8;border-radius:0.5rem;overflow:hidden;}
.ftog-opt{flex:1;padding:0.45rem 0.25rem;border:none;font-size:0.68rem;font-weight:500;
  cursor:pointer;background:white;color:#666;text-align:center;}
.ftog-opt.on{background:#378ADD;color:white;font-weight:600;}
.ftog-opt:active{opacity:0.8;}
.mtiles{display:flex;flex-wrap:wrap;gap:0.35rem;margin-top:0.15rem;}
.mtile{display:flex;flex-direction:column;align-items:center;gap:0.15rem;
  padding:0.4rem 0.5rem;border-radius:0.55rem;border:1.5px solid #e0d8c8;
  background:white;cursor:pointer;min-width:2.6rem;}
.mtile:active{transform:scale(0.96);}
.mtile.sel{border-color:#1D9E75;background:#E1F5EE;}
.mtile-ico{font-size:1rem;}.mtile-lbl{font-size:0.5rem;font-weight:600;color:#333;}
.mtile.sel .mtile-lbl{color:#085041;}
.fam-group{margin-bottom:0.65rem;}
.fam-group-lbl{font-size:0.55rem;font-weight:700;color:#888;text-transform:uppercase;
  letter-spacing:0.04em;padding:0.18rem 0.45rem;background:#f2f0eb;border-radius:0.3rem;display:block;margin-bottom:0.3rem;}
.comp-row{display:flex;gap:0.35rem;align-items:center;margin-bottom:0.35rem;}
.comp-add{background:#E6F1FB;border:none;border-radius:0.5rem;padding:0.45rem 0.55rem;font-size:0.8rem;cursor:pointer;color:#0C447C;flex-shrink:0;}
.comp-list{margin-top:0.25rem;}
.comp-item{display:flex;align-items:center;gap:0.35rem;padding:0.28rem 0;font-size:0.68rem;color:#333;border-bottom:0.5px solid #f0ede6;}
.comp-item:last-child{border-bottom:none;}
.comp-del{background:none;border:none;font-size:0.8rem;color:#E53935;cursor:pointer;}
.sbtn{width:100%;padding:0.7rem;border:none;border-radius:0.6rem;font-size:0.88rem;
  font-weight:600;cursor:pointer;margin-top:0.7rem;}
.sbtn:active{opacity:0.85;}
.sbtn.ryan{background:#7F77DD;color:white;}.sbtn.family{background:#1D9E75;color:white;}
.sbtn.flight{background:#378ADD;color:white;}.sbtn.hotel{background:#D85A30;color:white;}
.sbtn.reserve{background:#9B59B6;color:white;}
.dbtn{width:100%;padding:0.58rem;border:1.5px solid #E53935;border-radius:0.6rem;
  font-size:0.76rem;cursor:pointer;margin-top:0.45rem;background:white;color:#E53935;}
.dbtn:active{background:#FFEBEE;}
.drow{display:flex;gap:0.45rem;padding:0.5rem 0;border-bottom:0.5px solid #f0ede6;align-items:flex-start;}
.drow:last-child{border-bottom:none;}
.dlbl{font-size:0.56rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.04em;width:5rem;flex-shrink:0;padding-top:0.05rem;}
.dval{font-size:0.75rem;color:#111;flex:1;line-height:1.4;}
.ctx{display:none;position:fixed;background:white;border:1px solid #e0d0b0;
  border-radius:0.6rem;z-index:700;min-width:9.5rem;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,0.13);}
.ctx.open{display:block;}
.cxi{padding:0.65rem 0.82rem;font-size:0.72rem;cursor:pointer;display:flex;align-items:center;gap:0.45rem;color:#111;}
.cxi:active{background:#f5f0e8;}.cxi.red{color:#E53935;}
.cxd{height:0.5px;background:#ece8e0;}
.covr{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:750;}
.covr.open{display:block;}
.cmod{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:white;border-radius:1rem;width:min(88vw,22rem);padding:1.3rem 1.1rem;
  z-index:760;display:none;box-shadow:0 8px 40px rgba(0,0,0,0.22);}
.cmod.open{display:block;}
.cmod-t{font-size:0.88rem;font-weight:600;color:#111;margin-bottom:0.45rem;}
.cmod-m{font-size:0.7rem;color:#666;line-height:1.55;margin-bottom:0.9rem;}
.cmod-btns{display:flex;gap:0.45rem;}
.cmod-cancel{flex:1;padding:0.62rem;border:1.5px solid #e0d0b0;border-radius:0.6rem;background:none;font-size:0.75rem;cursor:pointer;color:#666;}
.cmod-ok{flex:1;padding:0.62rem;border:none;border-radius:0.6rem;background:#E53935;color:white;font-size:0.75rem;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="fscreen" id="fscreen">
  <div class="fscreen-wave">&#x2708;&#xFE0F;&#x1F30A;</div>
  <div class="fscreen-title">Family Travel</div>
  <div class="fscreen-sub">Select your family to continue</div>
  <div class="fscreen-grid">
    <div class="ftile" onclick="this.style.opacity='0.5';pickFamily('jmcr')">
      <span class="ftile-ico">&#x1F3D6;&#xFE0F;</span>
      <span class="ftile-name">JMCR</span>
      <span class="ftile-members">Jon &middot; Mary &middot; Cordy &middot; Mav<br>+ Ryan</span>
    </div>
    <div class="ftile" onclick="this.style.opacity='0.5';pickFamily('matthews')">
      <span class="ftile-ico">&#x1F6A2;</span>
      <span class="ftile-name">Matthews</span>
      <span class="ftile-members">Dad &middot; Mom &middot; Reagan<br>Lincoln &middot; Nixon</span>
    </div>
    <div class="ftile" onclick="this.style.opacity='0.5';pickFamily('silvermans')">
      <span class="ftile-ico">&#x2B50;</span>
      <span class="ftile-name">Silvermans</span>
      <span class="ftile-members">Josh &middot; Lori<br>Mikayla &middot; Zach</span>
    </div>
  </div>
</div>
<div class="lscreen hide" id="lscreen">
  <div class="lscreen-ico">&#x2708;&#xFE0F;</div>
  <div class="lscreen-txt">Loading your trip...</div>
  <div class="ldbg" id="ldbg"></div>
</div>
<div id="app">
  <div class="hero">
    <div class="hero-sun"></div>
    <div class="hero-row">
      <span class="hero-emoji">&#x2708;&#xFE0F;</span>
      <div class="hero-txt">
        <div class="hero-badge" onclick="switchFamily()"><i class="ti ti-refresh"></i><span id="hBadge">Family</span></div>
        <div class="hero-title">Family Vacation Checklist &#x1F30A;</div>
        <div class="hero-sub">Pack smart &mdash; adventure awaits! &#x1F41A;</div>
      </div>
      <span class="sdot" id="sdot"></span>
    </div>
    <div class="prog-row">
      <div style="flex:1;">
        <div class="pw"><div class="pb" id="pb" style="width:0%"></div></div>
        <div class="pl" id="pl"></div>
      </div>
      <button class="newtrip-btn" onclick="openNewTrip()"><i class="ti ti-refresh" style="font-size:0.7rem;"></i> New trip</button>
    </div>
    <svg class="hero-beach" viewBox="0 0 400 45" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="45" fill="#87CEEB"/>
      <rect x="0" y="22" width="400" height="23" fill="#1565C0"/>
      <path d="M0 22 Q20 18 40 22 Q60 26 80 22 Q100 18 120 22 Q140 26 160 22 Q180 18 200 22 Q220 26 240 22 Q260 18 280 22 Q300 26 320 22 Q340 18 360 22 Q380 26 400 22 L400 45 L0 45Z" fill="#42A5F5"/>
      <path d="M0 27 Q25 24 50 27 Q75 30 100 27 Q125 24 150 27 Q175 30 200 27 Q225 24 250 27 Q275 30 300 27 Q325 24 350 27 Q375 30 400 27 L400 45 L0 45Z" fill="#64B5F6" opacity="0.7"/>

// Pure fetch-based Supabase client - bypasses Safari Headers clone bug
var sb = (function(){
  var BASE = SB_URL + '/rest/v1/';
  var HEADERS = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
                 'Content-Type': 'application/json', 'Prefer': 'return=representation'};

  function qb(table) {
    var _table = table;
    var _filters = [];
    var _select = '*';
    var _order = null;
    var _limit = null;
    var _single = false;
    var _upsertConflict = null;

    var q = {
      select: function(s){ _select=s; return q; },
      eq: function(col,val){ _filters.push(col+'=eq.'+encodeURIComponent(val)); return q; },
      order: function(col){ if(!_order) _order=col; else _order+=','+col; return q; },
      limit: function(n){ _limit=n; return q; },
      single: function(){ _single=true; return q; },

      _url: function(method){
        var url = BASE + _table + '?select=' + encodeURIComponent(_select);
        _filters.forEach(function(f){ url += '&' + f; });
        if(_order) url += '&order=' + _order;
        if(_limit) url += '&limit=' + _limit;
        return url;
      },

      then: function(){ throw new Error('Use await, not .then()'); },

      // Terminal ops
      _exec: async function(method, body){
        var url = q._url(method);
        var opts = { method: method,
          headers: Object.assign({}, HEADERS,
            _single ? {'Accept':'application/vnd.pgrst.object+json'} : {}) };
        if(body !== undefined) opts.body = JSON.stringify(body);
        try {
          var res = await fetch(url, opts);
          var text = await res.text();
          var data = text ? JSON.parse(text) : (_single ? null : []);
          if(!res.ok) return {data: null, error: {message: (data && data.message) || res.statusText}};
          return {data: _single ? data : (Array.isArray(data)?data:[data]), error: null};
        } catch(e) {
          return {data: null, error: {message: e.message}};
        }
      }
    };

    // Make the query object awaitable by being a thenable
    // but we need it to work with await - override select/insert/update/delete
    q.select = function(s){ _select=s; return Object.assign({}, q, {
      then: function(res,rej){ return q._exec('GET').then(res,rej); }
    }); };

    return q;
  }

  // Full chainable builder
  function builder(table) {
    var _table = table;
    var _filters = [];
    var _select = '*';
    var _orders = [];
    var _limit = null;
    var _single = false;
    var _method = 'GET';
    var _body = undefined;
    var _upsertConflict = null;

    function url() {
      var u = BASE + _table + '?select=' + encodeURIComponent(_select);
      _filters.forEach(function(f){ u += '&' + f; });
      if(_orders.length) u += '&order=' + _orders.join(',');
      if(_limit) u += '&limit=' + _limit;
      return u;
    }

    async function exec() {
      var h = {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
               'Content-Type': 'application/json'};
      if(_upsertConflict) h['Prefer'] = 'return=representation,resolution=merge-duplicates,on_conflict='+_upsertConflict;
      else if(_method !== 'GET' && _method !== 'DELETE') h['Prefer'] = 'return=representation';
      if(_single) h['Accept'] = 'application/vnd.pgrst.object+json';
      var opts = {method:_method, headers:h};
      if(_body !== undefined) opts.body = JSON.stringify(_body);
      try {
        var res = await fetch(url(), opts);
        var text = await res.text();
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch(e){}
        if(!res.ok) {
          var msg = (data && (data.message || data.hint || data.details)) || res.statusText || 'Request failed';
          return {data:null, error:{message:msg}};
        }
        if(_single) return {data: data, error:null};
        return {data: Array.isArray(data)?data:(data?[data]:[]), error:null};
      } catch(e) {
        return {data:null, error:{message:e.message}};
      }
    }

    var b = {
      select:  function(s){ _select=s||'*'; return b; },
      eq:      function(col,val){ _filters.push(col+'=eq.'+encodeURIComponent(val)); return b; },
      order:   function(col){ _orders.push(col); return b; },
      limit:   function(n){ _limit=n; return b; },
      single:  function(){ _single=true; return b; },
      then:    function(res,rej){ return exec().then(res,rej); },
      catch:   function(rej){ return exec().catch(rej); },

      insert:  function(data){ _method='POST'; _body=data; return b; },
      update:  function(data){ _method='PATCH'; _body=data; return b; },
      upsert:  function(data, opts){
        _method='POST'; _body=data;
        _upsertConflict = (opts&&opts.onConflict) || '';
        return b;
      },
      delete:  function(){ _method='DELETE'; return b; },
    };
    return b;
  }

  // RPC calls
  async function rpc(fnName, params) {
    try {
      var res = await fetch(SB_URL + '/rest/v1/rpc/' + fnName, {
        method: 'POST',
        headers: {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
        body: JSON.stringify(params||{})
      });
      var text = await res.text();
      var data = text ? JSON.parse(text) : null;
      if(!res.ok) return {data:null,error:{message:(data&&data.message)||res.statusText}};
      return {data:data,error:null};
    } catch(e) {
      return {data:null,error:{message:e.message}};
    }
  }

  // Realtime via WebSocket
  var _channels = {};
  var _ws = null;
  var _wsReady = false;
  var _pendingSubs = [];
  var _channelCallbacks = {};

  function connectWS() {
    if(_ws) return;
    var wsUrl = SB_URL.replace('https://','wss://').replace('http://','ws://') 
                + '/realtime/v1/websocket?apikey=' + SB_KEY + '&vsn=1.0.0';
    try {
      _ws = new WebSocket(wsUrl);
      _ws.onopen = function() {
        _wsReady = true;
        _pendingSubs.forEach(function(fn){ fn(); });
        _pendingSubs = [];
      };
      _ws.onmessage = function(evt) {
        try {
          var msg = JSON.parse(evt.data);
          if(msg.event === 'postgres_changes' || (msg.payload && msg.payload.type === 'broadcast')) {
            var topic = msg.topic;
            if(_channelCallbacks[topic]) {
              _channelCallbacks[topic].forEach(function(cb){ try{cb(msg);}catch(e){} });
            }
          }
        } catch(e) {}
      };
      _ws.onerror = function(e){ console.warn('Realtime WS error',e); };
      _ws.onclose = function(){ _ws=null; _wsReady=false; };
    } catch(e) { console.warn('Realtime not available',e); }
  }

  function channel(name) {
    var _name = name;
    var _subs = [];

    var ch = {
      on: function(event, filter, callback) {
        _subs.push({event:event, filter:filter, callback:callback});
        return ch;
      },
      subscribe: function() {
        // Poll-based fallback (10s intervals) since WS setup is complex
        // Real apps would use proper WS subscription; polling works fine for this use case
        var pollInterval = setInterval(async function() {
          _subs.forEach(async function(sub) {
            if(sub.callback) {
              try { sub.callback({}); } catch(e) {}
            }
          });
        }, 10000);
        ch._interval = pollInterval;
        return ch;
      },
      _interval: null
    };
    _channels[name] = ch;
    return ch;
  }

  function removeChannel(ch) {
    if(ch && ch._interval) clearInterval(ch._interval);
  }

  return {
    from: builder,
    rpc: rpc,
    channel: channel,
    removeChannel: removeChannel
  };
})();

function updateProg(){
  if(S.fkey!=='jmcr'){document.getElementById('pl').textContent='';return;}
  var catIds=S.cats.map(function(c){return c.id;});
  var ryan=S.members.find(function(m){return m.is_subject;});
  var ri=S.items.filter(function(i){return catIds.indexOf(i.category_id)>=0||(ryan&&i.member_id===ryan.id);});
  var total=ri.filter(function(i){return!i.is_skipped;}).length;
  var done=ri.filter(function(i){return i.is_done;}).length;
  var pct=total?Math.round(done/total*100):0;
  document.getElementById('pb').style.width=pct+'%';
  document.getElementById('pl').textContent="Ryan's pack: "+done+" of "+total+" ("+pct+"%)";
}

async function toggleCheck(id){
  setSdot('saving');
  var item=S.items.find(function(i){return i.id===id;});if(!item)return;
  var nowDone=!item.is_done;
  var r=await sb.from('checklist_items').update({is_done:nowDone,done_by:nowDone?(S.user&&S.user.id||null):null,done_at:nowDone?new Date().toISOString():null,is_skipped:false}).eq('id',id);
  if(r.error){setSdot('err');return;}
  item.is_done=nowDone;item.done_by=nowDone?(S.user&&S.user.id||null):null;item.is_skipped=false;
  setSdot('');renderPanel();updateProg();
}
async function undoCheck(id){
  setSdot('saving');
  var r=await sb.from('checklist_items').update({is_done:false,done_by:null,done_at:null}).eq('id',id);
  if(r.error){setSdot('err');return;}
  var item=S.items.find(function(i){return i.id===id;});
  if(item){item.is_done=false;item.done_by=null;item.done_at=null;}
  setSdot('');renderPanel();updateProg();
}
async function skipItem(id){
  setSdot('saving');
  var item=S.items.find(function(i){return i.id===id;});if(!item)return;
  var ns=!item.is_skipped;
  var r=await sb.from('checklist_items').update({is_skipped:ns,is_done:false,done_by:null,done_at:null}).eq('id',id);
  if(r.error){setSdot('err');return;}
  item.is_skipped=ns;item.is_done=false;setSdot('');closeCtx();renderPanel();updateProg();
}
async function deleteItem(id){
  setSdot('saving');
  var r=await sb.from('checklist_items').delete().eq('id',id);
  if(r.error){setSdot('err');return;}
  S.items=S.items.filter(function(i){return i.id!==id;});setSdot('');closeCtx();renderPanel();updateProg();
}

async function submitAddItem(tab){
  var text=V('addTxt');if(!text){alert('Enter an item description.');return;}
  if(!S.trip){alert('No active trip.');return;}
  setSdot('saving');
  var rows=[];
  if(tab==='ryan'){
    var subName=S._sub||S.ryanSub;delete S._sub;
    var cat=S.cats.find(function(c){return c.name===subName;});
    if(!cat){alert('Category not found.');setSdot('err');return;}
    rows.push({trip_id:S.trip.id,category_id:cat.id,text:text,created_by:S.user&&S.user.id||null});
  }else{
    var selected=[].slice.call(document.querySelectorAll('#addTgt .mtile.sel'));
    if(!selected.length){alert('Select at least one person.');setSdot('err');return;}
    selected.forEach(function(el){rows.push({trip_id:S.trip.id,member_id:el.dataset.mid,text:text,created_by:S.user&&S.user.id||null});});
  }
  var r=await sb.from('checklist_items').insert(rows).select();
  if(r.error){setSdot('err');console.error(r.error);return;}
  S.items=S.items.concat(r.data||[]);setSdot('');closeAll();renderPanel();updateProg();
}

function paxTiles(selIds){
  var groups={};var order=[];
  (S.allMembers||[]).forEach(function(m){
    if(!groups[m.family_id]){groups[m.family_id]={name:m.families&&m.families.name||m.family_id,mems:[]};order.push(m.family_id);}
    groups[m.family_id].mems.push(m);
  });
  return order.map(function(fid){
    var g=groups[fid];var isCur=fid===S.fid;
    var tiles=g.mems.map(function(m){
      var isSel=selIds?selIds.indexOf(m.id)>=0:isCur;
      return'<div class="mtile'+(isSel?' sel':'')+'" data-mid="'+m.id+'" style="border-color:'+(isSel?(m.icon_color||'#378ADD'):'#e0d8c8')+'" data-action="togMtile" data-color="'+(m.icon_color||'#378ADD')+'">'
        +'<i class="ti '+(m.icon||'ti-user')+' mtile-ico" style="color:'+(m.icon_color||'#666')+'"></i>'
        +'<span class="mtile-lbl">'+esc(m.name)+'</span></div>';
    }).join('');
    return'<div class="fam-group"><span class="fam-group-lbl">'+g.name+(isCur?' (your family)':'')+'</span><div class="mtiles">'+tiles+'</div></div>';
  }).join('');
}

async function submitFlight(editId){
  var from=V('fFrom'),to=V('fTo'),dep=V('fDep');
  if(!from||!to||!dep){alert('From, To and Departure are required.');return;}
  setSdot('saving');
  var isIns=document.querySelector('#insTog .on')&&document.querySelector('#insTog .on').textContent==='Yes';
  var row={trip_id:S.trip&&S.trip.id||null,origin_city:from,dest_city:to,
    departure_dt:new Date(dep).toISOString(),arrival_dt:V('fArr')?new Date(V('fArr')).toISOString():null,
    airline:V('fAl')||null,flight_number:V('fNum')||null,gate:V('fGate')||null,
    confirmation_no:V('fConf')||null,is_insured:isIns,
    insurance_policy_no:isIns?(V('fPol')||null):null,
    baggage_notes:V('fBag')||null,notes:V('fNotes')||null,entered_by:S.user&&S.user.id||null};
  var fid=editId;
  if(editId){await sb.from('flights').update(row).eq('id',editId);}
  else{var rd=await sb.from('flights').insert(row).select().single();if(rd.error){setSdot('err');console.error(rd.error);return;}fid=rd.data.id;}
  await sb.from('flight_passengers').delete().eq('flight_id',fid);
  var paxRows=[];
  getSelPax('#fpaxTiles').forEach(function(mid){
    var seat=document.querySelector('[data-seat="'+mid+'"]');
    paxRows.push({flight_id:fid,member_id:mid,seat:seat?seat.value.trim()||null:null,is_companion:false});
  });
  S.companions.forEach(function(c){paxRows.push({flight_id:fid,companion_name:c.name,seat:c.seat||null,is_companion:true});});
  if(paxRows.length)await sb.from('flight_passengers').insert(paxRows);
  S.companions=[];
  var rf=await sb.from('flights').select('*,flight_passengers(*,members(name,icon,icon_color))').order('departure_dt');
  S.flights=rf.data||[];setSdot('');closeAll();renderPanel();
}

async function delRec(type,id){

// Global delegated event handler for data-action elements
document.addEventListener('click', function(e) {
  var el = e.target.closest('[data-action]');
  if(!el) {
    // Check for data-dd (dropdown toggles)
    var dd = e.target.closest('[data-dd]');
    if(dd) { toggleDD(dd.dataset.dd); return; }
    return;
  }
  var action = el.dataset.action;
  var id = el.dataset.id;
  var tab = el.dataset.tab;
  var type = el.dataset.type;
  if(action==='flight')  { flightDetail(id); }
  else if(action==='hotel')   { hotelDetail(id); }
  else if(action==='reserve') { reserveDetail(id); }
  else if(action==='setRyan') { setRyanSub(el.dataset.sub); }
  else if(action==='setMember') { setMember(id); }
  else if(action==='skip') { skipItem(id); }
  else if(action==='undo') { undoCheck(id); }
  else if(action==='del')  { deleteItem(id); }
  else if(action==='addItem')   { openAddItem(tab); }
  else if(action==='addFlight') { openAddFlight(); }
  else if(action==='addHotel')  { openAddHotel(null); }
  else if(action==='addReserve'){ openAddReservation(null); }
  else if(action==='openEditFlight') { openEditFlight(id); }
  else if(action==='submitFlight') { submitFlight(id==='null'?null:id); }
  else if(action==='submitAddItem') { submitAddItem(tab); }
  else if(action==='delRec') { delRec(type, id); }
  else if(action==='editHotel') { var h=S.hotels.find(function(x){return x.id===id;}); if(h) openAddHotel(h); }
  else if(action==='editReserve') { var r=S.reserves.find(function(x){return x.id===id;}); if(r) openAddReservation(r); }
  else if(action==='removeComp') { removeComp(parseInt(el.dataset.idx)); }
  else if(action==='togMtile') { togMtile(el); }
  else if(action==='submitHotel') { submitHotel(id==='null'?null:id); }
  else if(action==='submitReserve') { submitReserve(id==='null'?null:id); }
});
