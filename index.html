function bindKP(){
  var addBtn=document.getElementById('splitAddBtn');if(addBtn)addBtn.onclick=function(){openKP();};
  var ovr=document.getElementById('kpOverlay');if(ovr)ovr.onclick=function(e){if(e.target===ovr)closeKP();};
  var di=document.getElementById('kpDateInp');
  if(di)di.onchange=function(){S.kp.dateVal=di.value+'T12:00';refreshKP();};
}
function openKP(){
  var j=famMemCount('jmcr');var m=famMemCount('matthews');var sv=famMemCount('silvermans');var jj=jjMemCount();
  S.kp={open:true,focus:'amount',amount:'',currency:'USD',cat:'Food',paidBy:'jmcr',desc:'',jmcrN:j,mattN:m,silvN:sv,jjN:jj,currDigits:'',dateVal:'',replacing:false};
  var sheet=document.getElementById('kpSheet');var ovr=document.getElementById('kpOverlay');
  if(sheet){sheet.classList.add('open');sheet.innerHTML=kpSheetHTML();}
  if(ovr)ovr.classList.add('open');
}
function refreshKP(){
  var di=document.getElementById('kpDesc');if(di)S.kp.desc=di.value;
  var sheet=document.getElementById('kpSheet');
  if(sheet&&sheet.classList.contains('open')){
    sheet.innerHTML=kpSheetHTML();
    var di2=document.getElementById('kpDesc');if(di2)di2.value=S.kp.desc||'';
    bindKP();
  }
}

function closeKP(){
  var sheet=document.getElementById('kpSheet');
  var ovr=document.getElementById('kpOverlay');
  if(sheet)sheet.classList.remove('open');
  if(ovr)ovr.classList.remove('open');
  S.kp.open=false;
}
function kpFocus(f){
  var cur=S.kp.focus;
  // commit current digits to the field we're leaving
  if(cur!==f){
    if(cur==='amount'){S.kp.amount=S.kp.currDigits||S.kp.amount||'0';}
    else if(cur==='jmcr'){S.kp.jmcrN=parseInt(S.kp.currDigits)||0;}
    else if(cur==='matthews'){S.kp.mattN=parseInt(S.kp.currDigits)||0;}
    else if(cur==='silvermans'){S.kp.silvN=parseInt(S.kp.currDigits)||0;}
    else if(cur==='jj'){S.kp.jjN=parseInt(S.kp.currDigits)||0;}
  }
  // seed currDigits with existing value for display, mark as "replace on first key"
  if(f==='amount'){S.kp.currDigits=S.kp.amount||'';}
  else if(f==='jmcr'){S.kp.currDigits=S.kp.jmcrN?String(S.kp.jmcrN):'';}
  else if(f==='matthews'){S.kp.currDigits=S.kp.mattN?String(S.kp.mattN):'';}
  else if(f==='silvermans'){S.kp.currDigits=S.kp.silvN?String(S.kp.silvN):'';}
  else if(f==='jj'){S.kp.currDigits=S.kp.jjN?String(S.kp.jjN):'';}
  S.kp.focus=f;
  S.kp.replacing=true;  // first keypress will replace, not append
  refreshKP();
}
function kpKey(k){
  var isAmt=S.kp.focus==='amount';
  if(k==='.'&&!isAmt)return; // no decimal for people counts
  // first keypress after focusing replaces the old value entirely
  if(S.kp.replacing){S.kp.currDigits='';S.kp.replacing=false;}
  var d=S.kp.currDigits!=null?S.kp.currDigits:'';
  if(k==='.'&&d.indexOf('.')>=0)return;
  if(d==='0'&&k!=='.')d='';
  d+=k;
  S.kp.currDigits=d;
  // keep live values in sync for display
  if(isAmt)S.kp.amount=d;
  else if(S.kp.focus==='jmcr')S.kp.jmcrN=parseInt(d)||0;
  else if(S.kp.focus==='matthews')S.kp.mattN=parseInt(d)||0;
  else if(S.kp.focus==='silvermans')S.kp.silvN=parseInt(d)||0;
  else if(S.kp.focus==='jj')S.kp.jjN=parseInt(d)||0;
  refreshKP();
}
function kpDel(){
  var isAmt=S.kp.focus==='amount';
  // first DEL after focusing clears the whole field
  if(S.kp.replacing){S.kp.replacing=false;S.kp.currDigits='0';
    if(isAmt)S.kp.amount='';
    else if(S.kp.focus==='jmcr')S.kp.jmcrN=0;
    else if(S.kp.focus==='matthews')S.kp.mattN=0;
    else if(S.kp.focus==='silvermans')S.kp.silvN=0;
    else if(S.kp.focus==='jj')S.kp.jjN=0;
    refreshKP();return;
  }
  var d=S.kp.currDigits!=null?S.kp.currDigits:'0';
  d=d.length>1?d.slice(0,-1):'0';
  S.kp.currDigits=d;
  if(isAmt)S.kp.amount=d==='0'?'':d;
  else if(S.kp.focus==='jmcr')S.kp.jmcrN=parseInt(d)||0;
  else if(S.kp.focus==='matthews')S.kp.mattN=parseInt(d)||0;
  else if(S.kp.focus==='silvermans')S.kp.silvN=parseInt(d)||0;
  else if(S.kp.focus==='jj')S.kp.jjN=parseInt(d)||0;
  refreshKP();
}
function handleKPClick(e){var sortOpt=e.target.closest('[data-sort]');if(sortOpt){S.sortBy=sortOpt.dataset.sort;renderPanel();return;}var sortPill=e.target.closest('#sortPill');if(sortPill){S.sortBy=S.sortBy==='date'?'paidby':'date';renderPanel();return;}var sv=e.target.closest('[data-sv]');if(sv){S.splitView=sv.dataset.sv;renderPanel();return;}var cur=e.target.closest('[data-cur]');if(cur){S.kp.currency=cur.dataset.cur;refreshKP();return;}var kpf=e.target.closest('[data-kpf]');if(kpf){kpFocus(kpf.dataset.kpf);return;}var cat=e.target.closest('[data-cat]');if(cat){S.kp.cat=cat.dataset.cat;refreshKP();return;}var pb=e.target.closest('[data-pb]');if(pb){S.kp.paidBy=pb.dataset.pb;refreshKP();return;}var kk=e.target.closest('[data-key]');if(kk){var k=kk.dataset.key;if(k==='DEL')kpDel();else kpKey(k);return;}var kpDate=e.target.closest('[data-kpdate]');if(kpDate){return;}var kpTime=e.target.closest('[data-kptime]');if(kpTime){return;}if(e.target.closest('#kpCfmBtn')){submitExpense();return;}if(e.target.closest('[data-kpclose]')){closeKP();return;}var expedit=e.target.closest('[data-expedit]');if(expedit){openEditExpense(expedit.dataset.expedit);return;}var expdel=e.target.closest('[data-expdel]');if(expdel){var eid=expdel.dataset.expdel;if(confirm('Delete this expense?')){sdot('saving');sb.from('expense_splits').delete().eq('expense_id',eid).then(function(){sb.from('expenses').delete().eq('id',eid).then(function(){loadExpenses(function(exps){S.expenses=exps;sdot('');renderPanel();});});});}return;}}

function openEditExpense(eid){
  var e=S.expenses.find(function(x){return x.id===eid;});if(!e)return;
  var spl=e.expense_splits||[];
  var j=spl.find(function(x){return x.family_key==='jmcr';});
  var m=spl.find(function(x){return x.family_key==='matthews';});
  var sv=spl.find(function(x){return x.family_key==='silvermans';});
  var jj=spl.find(function(x){return x.family_key==='jj';});
  S.kp={open:true,focus:'amount',
    amount:String(e.amount||''),currency:e.currency||'USD',
    cat:e.category||'Food',paidBy:e.paid_by_family||'jmcr',
    desc:e.description||'',
    jmcrN:j?j.people_count:0,mattN:m?m.people_count:0,silvN:sv?sv.people_count:0,jjN:jj?jj.people_count:0,
    currDigits:String(e.amount||''),dateVal:'',editId:eid,replacing:true};
  var sheet=document.getElementById('kpSheet');
  var ovr=document.getElementById('kpOverlay');
  if(sheet){sheet.classList.add('open');sheet.innerHTML=kpSheetHTML();}
  if(ovr)ovr.classList.add('open');
}
function submitExpense(){
  var _descEl=document.getElementById('kpDesc');if(_descEl)S.kp.desc=_descEl.value;
  var amt=parseFloat(S.kp.amount)||0;if(!amt){alert('Enter an amount.');return;}
  var tp=(S.kp.jmcrN||0)+(S.kp.mattN||0)+(S.kp.silvN||0)+(S.kp.jjN||0);
  if(!tp){alert('Add at least one family.');return;}
  if(!S.trip){alert('No active trip.');return;}
  sdot('saving');
  var amtUSD=S.kp.currency==='EUR'?amt*(S.exRate||1.09):amt;
  var isEdit=S.kp.editId;
  if(isEdit){
    sb.from('expenses').update({description:S.kp.desc||'',category:S.kp.cat,amount:amt,amount_usd:parseFloat(amtUSD.toFixed(2)),currency:S.kp.currency,paid_by_family:S.kp.paidBy}).eq('id',isEdit)
    .then(function(ru){
      if(ru.error){sdot('err');alert('Update failed: '+ru.error.message);return;}
      sb.from('expense_splits').delete().eq('expense_id',isEdit).then(function(){
        var splits=[];
        if(S.kp.jmcrN>0)splits.push({expense_id:isEdit,family_key:'jmcr',people_count:S.kp.jmcrN});
        if(S.kp.mattN>0)splits.push({expense_id:isEdit,family_key:'matthews',people_count:S.kp.mattN});
        if(S.kp.silvN>0)splits.push({expense_id:isEdit,family_key:'silvermans',people_count:S.kp.silvN});
        if(S.kp.jjN>0)splits.push({expense_id:isEdit,family_key:'jj',people_count:S.kp.jjN});
        var sp=splits.length?sb.from('expense_splits').insert(splits):Promise.resolve({});
        sp.then(function(){loadExpenses(function(exps){S.expenses=exps;sdot('');closeKP();renderPanel();});});
      });
    });
    return;
  }
  var row={trip_id:S.trip.id,description:S.kp.desc||'',category:S.kp.cat,amount:amt,amount_usd:parseFloat(amtUSD.toFixed(2)),currency:S.kp.currency,paid_by_family:S.kp.paidBy,created_at:S.kp.dateVal?new Date(S.kp.dateVal).toISOString():new Date().toISOString()};
  sb.from('expenses').insert(row).select().then(function(r){
    if(r.error){sdot('err');alert('Save failed: '+r.error.message);return;}
    var eid=r.data&&r.data[0]&&r.data[0].id;if(!eid){sdot('err');return;}
    var splits=[];
    if(S.kp.jmcrN>0)splits.push({expense_id:eid,family_key:'jmcr',people_count:S.kp.jmcrN});
    if(S.kp.mattN>0)splits.push({expense_id:eid,family_key:'matthews',people_count:S.kp.mattN});
    if(S.kp.silvN>0)splits.push({expense_id:eid,family_key:'silvermans',people_count:S.kp.silvN});
    if(S.kp.jjN>0)splits.push({expense_id:eid,family_key:'jj',people_count:S.kp.jjN});
    var sp2=splits.length?sb.from('expense_splits').insert(splits):Promise.resolve({});
    sp2.then(function(){loadExpenses(function(exps){S.expenses=exps;sdot('');closeKP();renderPanel();});});
  });
}
