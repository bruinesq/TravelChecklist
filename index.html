<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel">
<title>Family Travel</title>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f0e8;overscroll-behavior:none}
.fscreen{position:fixed;inset:0;background:linear-gradient(160deg,#1a6b8a,#0d4f6b,#0a3d54);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000;padding:2rem}
.fscreen.hide{display:none}
.fscreen-title{font-size:1.4rem;font-weight:700;color:white;margin-bottom:.3rem}
.fscreen-sub{font-size:.75rem;color:rgba(255,255,255,.65);margin-bottom:2rem}
.fscreen-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;max-width:22rem}
.ftile{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.5rem 1rem;border-radius:1rem;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);cursor:pointer}
.ftile:active{background:rgba(255,255,255,.3)}
.ftile-ico{font-size:2rem}.ftile-name{font-size:.95rem;font-weight:700;color:white}
.ftile-sub{font-size:.6rem;color:rgba(255,255,255,.65);text-align:center;line-height:1.4}
.lscreen{position:fixed;inset:0;background:linear-gradient(160deg,#1a6b8a,#0a3d54);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8000}
.lscreen.hide{display:none}
.lscreen-ico{font-size:3rem;margin-bottom:1rem}
.lscreen-txt{font-size:.9rem;color:rgba(255,255,255,.8);font-weight:500}
#app{display:none}
.hero{background:#87CEEB;padding:.75rem .9rem 4.2rem;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1.6rem;background:#f2f0eb;clip-path:ellipse(55% 100% at 50% 100%)}
.hero-sun{position:absolute;top:.5rem;right:.5rem;width:2rem;height:2rem;border-radius:50%;background:radial-gradient(circle,#FFE566 40%,#FFD700 70%,transparent 100%);pointer-events:none;z-index:1}
.hero-badge{position:absolute;top:.45rem;right:3rem;z-index:2;display:inline-flex;align-items:center;gap:.25rem;background:rgba(0,43,92,.25);border-radius:99px;padding:.2rem .55rem;font-size:.6rem;font-weight:700;color:#002B5C;cursor:pointer;border:none;-webkit-appearance:none}
.hero-badge:active{background:rgba(0,43,92,.4)}
.hero-row{display:flex;align-items:center;gap:.5rem;position:relative;z-index:1}
.hero-emoji{font-size:2.6rem;line-height:1;flex-shrink:0}
.hero-txt{flex:1}
.hero-title{font-size:.95rem;font-weight:700;color:#002B5C}
.hero-sub{font-size:.58rem;color:#003A7A;margin-top:.1rem}
.prog-row{display:flex;align-items:center;gap:.5rem;margin-top:.55rem;position:relative;z-index:1}
.pw{flex:1;background:rgba(0,43,92,.15);border-radius:99px;height:.4rem}
.pb{background:#FFD700;border-radius:99px;height:.4rem;transition:width .4s}
.pl{font-size:.55rem;color:#002B5C;font-weight:600;margin-top:.2rem}
.newtrip-btn{display:flex;align-items:center;gap:.2rem;padding:.28rem .55rem;border-radius:.5rem;border:1.5px solid rgba(0,43,92,.35);background:rgba(255,255,255,.45);font-size:.58rem;color:#002B5C;cursor:pointer;flex-shrink:0;font-weight:600}
.sdot{width:.45rem;height:.45rem;border-radius:50%;background:rgba(0,43,92,.28);display:inline-block;transition:background .3s;flex-shrink:0}
.sdot.saving{background:#FFD700}.sdot.err{background:#E53935}
.hero-beach{position:absolute;bottom:.6rem;left:0;right:0;width:100%;height:2.8rem;pointer-events:none}
.toolbar{background:white;padding:.3rem .7rem;border-bottom:1px solid #e4e0d8;display:flex;align-items:center;gap:.5rem;min-height:2.6rem;overflow:hidden}
.tb-packer{display:flex;align-items:center;gap:.3rem;cursor:pointer;padding:.2rem .3rem;border-radius:.5rem;flex-shrink:0;border:none;background:none}
.tb-packer:active{background:#f0ede6}
.tb-packer-ico{font-size:1.1rem;color:#444}
.tb-vchev{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1}
.tb-vchev i{font-size:.72rem;color:#333;font-weight:900;display:block}
.tb-packer-name{font-size:.65rem;font-weight:700;padding:.15rem .42rem;border-radius:99px}
.tb-spacer{flex:1}
.tb-sdot{display:inline-block}
.tb-pencil{background:none;border:none;cursor:pointer;font-size:1.05rem;color:#aaa;padding:.2rem .25rem;flex-shrink:0}
.nav{display:flex;border-bottom:1.5px solid #ddd8cc;background:#f2f0eb}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.42rem .1rem .48rem;border:none;cursor:pointer;background:transparent;border-top:3px solid transparent;border-right:1px solid #e0d8c8}

.ntab.active{background:white}

.ntab.active.t-reserve{border-top-color:#9B59B6}
.ntab-ico{font-size:1rem;line-height:1;color:#999}
.ntab.active .ntab-ico{color:#222}
.ntab-lbl{font-size:.52rem;font-weight:700;color:#888;white-space:nowrap}
.ntab.active .ntab-lbl{color:#222}
.selbar{display:flex;align-items:stretch;min-height:3.2rem;border-bottom:2px solid;cursor:pointer;width:100%}
.selbar-tab{width:2.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05rem;flex-shrink:0}

.selbar-lbl{font-size:.92rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar-add{background:none;border:none;font-size:.88rem;font-weight:800;cursor:pointer;padding:.2rem .6rem;flex-shrink:0;letter-spacing:.01em}
.ddwrap{position:relative;width:100%}
.ddmenu{position:absolute;top:0;left:0;right:0;background:white;border:1px solid #e0d8c8;border-radius:0 0 .7rem .7rem;z-index:400;box-shadow:0 8px 24px rgba(0,0,0,.14);display:none;overflow:hidden}
.ddmenu.open{display:block}
.dditem{display:flex;align-items:center;gap:.55rem;padding:.72rem .85rem;cursor:pointer;font-size:.88rem;color:#111;border-bottom:.5px solid rgba(0,0,0,.05);border-left:5px solid transparent}

.dditem:active{filter:brightness(.96)}
.dditem.sel{font-weight:700}
.dditem-ico{font-size:1rem;flex-shrink:0}
.dditem-lbl{flex:1;font-weight:600}
.dditem-cnt{font-size:.7rem;font-weight:700;color:#555;white-space:nowrap}
.dddivider{height:2px;background:#ece8e0;margin:.2rem 0}
.ilist{list-style:none}
.irow{display:flex;align-items:center;gap:.38rem;padding:.75rem .75rem;border-bottom:1px solid #cdc7bb;min-height:3rem;background:rgba(245,240,232,.92);width:100%}
.irow:last-child{border-bottom:none}
.irow.done{opacity:.48}
.irow.skip{background:repeating-linear-gradient(90deg,transparent,transparent 8px,rgba(0,0,0,.02) 8px,rgba(0,0,0,.02) 9px)}
.ichk{width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid #9abf9a;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.78rem;flex-shrink:0;color:transparent}

.itxt{flex:1;font-size:.95rem;font-weight:700;color:#1a120a;min-width:0;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itxt.struck{text-decoration:line-through;color:#999;font-weight:400}
.itxt.skp{font-style:italic;color:#b0a070}
.iundo{font-size:.56rem;color:#1D9E75;cursor:pointer;text-decoration:underline;display:block;border:none;background:none;padding:0;margin-top:.1rem}
.istamp{font-size:.5rem;padding:.07rem .35rem;border-radius:99px;font-weight:600;flex-shrink:0;white-space:nowrap}
.iskip{font-size:.48rem;padding:.07rem .32rem;border-radius:.25rem;background:rgba(0,0,0,.07);color:#8a7040;font-style:italic;border:1px dashed #c0a868;flex-shrink:0}
.idot{background:none;border:none;cursor:pointer;font-size:.95rem;color:#bbb;flex-shrink:0;width:1.8rem;height:1.8rem;display:flex;align-items:center;justify-content:center}
.empty{padding:2.2rem 1.5rem;text-align:center;color:#8a7a60;font-size:.82rem;background:#f5f0e8}
.cards{display:flex;flex-direction:column;background:#f5f0e8}
.fcard{background:#f5f0e8;border-bottom:2px solid #cdc7bb;padding:.9rem .95rem;cursor:pointer}
.fcard:active{background:#faf8f4}.fcard.past{opacity:.55}
.fcard-row{display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem}
.fcard-title{font-size:1.05rem;font-weight:800;color:#1a1a2e;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard-addcost{display:inline-flex;align-items:center;gap:2px;font-size:.62rem;font-weight:700;background:#FEF3C7;color:#92600A;border-radius:5px;padding:2px 6px;flex-shrink:0;white-space:nowrap}
.fcard-chev{font-size:1.1rem;color:#888;flex-shrink:0}
.fcard-pill{display:inline-block;font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;margin-right:.35rem}
.fcard-sub{font-size:.88rem;font-weight:600;color:#1a120a;line-height:1.5}
.fcard-pax{font-size:.78rem;color:#2c2010;font-weight:500;margin-top:.2rem;line-height:1.4}
.secsep{padding:.3rem .85rem;background:#ede7d9;font-size:.58rem;font-weight:700;color:#7a6a58;text-transform:uppercase;letter-spacing:.05em}
.addbar{display:flex;align-items:center;padding:.5rem .85rem;border-bottom:1px solid #cdc7bb;background:#f5f0e8}
.addbar-lbl{font-size:.9rem;font-weight:800;flex:1;color:#1a120a}
.addbar-btn{border:none;background:none;padding:.35rem .75rem;font-size:.88rem;font-weight:800;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500}
.overlay.open{display:block}
.cpanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:1rem;width:min(92vw,26rem);max-height:85vh;overflow-y:auto;z-index:600;display:none;box-shadow:0 8px 40px rgba(0,0,0,.22)}.cpanel.flight-detail{background:#FFF176}.cpanel.flight-detail .cp-head{background:#FFD600;border-bottom:2px solid #F9A825}.cpanel.flight-detail .cp-title{color:#1A237E;font-size:1.1rem;font-weight:800}.cpanel.flight-detail .drow{border-bottom-color:#F9A825}.cpanel.flight-detail .dlbl{color:#1A237E;font-size:.72rem;font-weight:800}.cpanel.flight-detail .dval{color:#0D0D0D;font-size:1rem;font-weight:600}.cpanel.hotel-detail{background:#F0F0F0}.cpanel.hotel-detail .cp-head{background:#DCDCDC;border-bottom:2px solid #BDBDBD}.cpanel.hotel-detail .cp-title{color:#1A1A1A;font-size:1.1rem;font-weight:800}.cpanel.hotel-detail .drow{border-bottom-color:#BDBDBD}.cpanel.hotel-detail .dlbl{color:#333333;font-size:.72rem;font-weight:800}.cpanel.hotel-detail .dval{color:#111111;font-size:1rem;font-weight:600}.cpanel.hotel-detail .sbtn{font-size:1.05rem}.cpanel.hotel-detail .dbtn{font-size:.9rem}.cpanel.reserve-detail{background:#1B5E20}.cpanel.reserve-detail .cp-head{background:#145218;border-bottom:2px solid #0A3D12}.cpanel.reserve-detail .cp-title{color:#FFFFFF;font-size:1.1rem;font-weight:800}.cpanel.reserve-detail .cp-close{color:rgba(255,255,255,.7)}.cpanel.reserve-detail .drow{border-bottom-color:#2E7D32}.cpanel.reserve-detail .dlbl{color:#A5D6A7;font-size:.72rem;font-weight:800}.cpanel.reserve-detail .dval{color:#FFFFFF;font-size:1rem;font-weight:600}.cpanel.reserve-detail .sbtn{font-size:1.05rem}.cpanel.reserve-detail .dbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5);color:white;font-size:.9rem}
.cpanel.reserve-detail-restaurant{background:#6D1F0A}.cpanel.reserve-detail-restaurant .cp-head{background:#5A1A08;border-bottom:2px solid #3E1005}.cpanel.reserve-detail-restaurant .cp-title{color:#FFFFFF;font-size:1.1rem;font-weight:800}.cpanel.reserve-detail-restaurant .cp-close{color:rgba(255,255,255,.7)}.cpanel.reserve-detail-restaurant .drow{border-bottom-color:#8B3010}.cpanel.reserve-detail-restaurant .dlbl{color:#FFCCBC;font-size:.72rem;font-weight:800}.cpanel.reserve-detail-restaurant .dval{color:#FFFFFF;font-size:1rem;font-weight:600}.cpanel.reserve-detail-restaurant .sbtn{background:#9B59B6;font-size:1.05rem}.cpanel.reserve-detail-restaurant .dbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5);color:white;font-size:.9rem}
.cpanel.reserve-detail-tour{background:#0A3D2E}.cpanel.reserve-detail-tour .cp-head{background:#072E22;border-bottom:2px solid #041F17}.cpanel.reserve-detail-tour .cp-title{color:#FFFFFF;font-size:1.1rem;font-weight:800}.cpanel.reserve-detail-tour .cp-close{color:rgba(255,255,255,.7)}.cpanel.reserve-detail-tour .drow{border-bottom-color:#0E6064}.cpanel.reserve-detail-tour .dlbl{color:#B2EBF2;font-size:.72rem;font-weight:800}.cpanel.reserve-detail-tour .dval{color:#FFFFFF;font-size:1rem;font-weight:600}.cpanel.reserve-detail-tour .sbtn{background:#9B59B6;font-size:1.05rem}.cpanel.reserve-detail-tour .dbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5);color:white;font-size:.9rem}
.cpanel.reserve-detail-activity{background:#0A2A50}.cpanel.reserve-detail-activity .cp-head{background:#071E3C;border-bottom:2px solid #041428}.cpanel.reserve-detail-activity .cp-title{color:#FFFFFF;font-size:1.1rem;font-weight:800}.cpanel.reserve-detail-activity .cp-close{color:rgba(255,255,255,.7)}.cpanel.reserve-detail-activity .drow{border-bottom-color:#1A4A80}.cpanel.reserve-detail-activity .dlbl{color:#BBDEFB;font-size:.72rem;font-weight:800}.cpanel.reserve-detail-activity .dval{color:#FFFFFF;font-size:1rem;font-weight:600}.cpanel.reserve-detail-activity .sbtn{background:#9B59B6;font-size:1.05rem}.cpanel.reserve-detail-activity .dbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5);color:white;font-size:.9rem}
.cpanel.reserve-detail-transport{background:#4A3800}.cpanel.reserve-detail-transport .cp-head{background:#372900;border-bottom:2px solid #241B00}.cpanel.reserve-detail-transport .cp-title{color:#FFFFFF;font-size:1.1rem;font-weight:800}.cpanel.reserve-detail-transport .cp-close{color:rgba(255,255,255,.7)}.cpanel.reserve-detail-transport .drow{border-bottom-color:#7A6000}.cpanel.reserve-detail-transport .dlbl{color:#FFF59D;font-size:.72rem;font-weight:800}.cpanel.reserve-detail-transport .dval{color:#FFFFFF;font-size:1rem;font-weight:600}.cpanel.reserve-detail-transport .sbtn{background:#9B59B6;font-size:1.05rem}.cpanel.reserve-detail-transport .dbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5);color:white;font-size:.9rem}
.cpanel.reserve-detail-docking{background:#3A0050}.cpanel.reserve-detail-docking .cp-head{background:#2B003C;border-bottom:2px solid #1C0028}.cpanel.reserve-detail-docking .cp-title{color:#FFFFFF;font-size:1.1rem;font-weight:800}.cpanel.reserve-detail-docking .cp-close{color:rgba(255,255,255,.7)}.cpanel.reserve-detail-docking .drow{border-bottom-color:#6A0080}.cpanel.reserve-detail-docking .dlbl{color:#FCE4EC;font-size:.72rem;font-weight:800}.cpanel.reserve-detail-docking .dval{color:#FFFFFF;font-size:1rem;font-weight:600}.cpanel.reserve-detail-docking .sbtn{background:#9B59B6;font-size:1.05rem}.cpanel.reserve-detail-docking .dbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5);color:white;font-size:.9rem}
.cpanel.open{display:block}
.cp-head{display:flex;align-items:center;gap:.5rem;padding:.85rem 1rem .65rem;border-bottom:1px solid #ece8e0;position:sticky;top:0;background:white;z-index:1}
.cp-title{font-size:.92rem;font-weight:700;flex:1;color:#111}
.cp-close{background:none;border:none;font-size:1.2rem;color:#aaa;cursor:pointer}
.cp-body{padding:.75rem 1rem 1.2rem}
.fsec{margin-bottom:.88rem}
.flbl{font-size:.58rem;font-weight:700;color:#888;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.25rem;display:block}
.finp{width:100%;border:1.5px solid #e0d8c8;border-radius:.5rem;padding:.52rem .65rem;font-size:.84rem;background:#faf9f6;-webkit-appearance:none;outline:none;font-family:inherit;color:#111}
.finp:focus{border-color:#378ADD;background:white}
.fta{resize:none;min-height:3rem;line-height:1.4}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.42rem}
.ftog{display:flex;border:1.5px solid #e0d8c8;border-radius:.5rem;overflow:hidden}
.ftog-opt{flex:1;padding:.42rem .2rem;border:none;font-size:.7rem;font-weight:500;cursor:pointer;background:white;color:#666;text-align:center}
.ftog-opt.on{background:#378ADD;color:white;font-weight:600}
.mtiles{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.15rem}
.mtile{display:flex;flex-direction:column;align-items:center;gap:.12rem;padding:.4rem .45rem;border-radius:.5rem;border:1.5px solid #e0d8c8;background:white;cursor:pointer;min-width:2.8rem}
.mtile.sel{border-color:#1D9E75;background:#E1F5EE}
.fam-group{margin-bottom:.6rem}
.fam-group-lbl{font-size:.52rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;padding:.15rem .42rem;background:#f2f0eb;border-radius:.3rem;display:block;margin-bottom:.28rem}
.comp-row{display:flex;gap:.35rem;align-items:center;margin-bottom:.32rem}

.sbtn{width:100%;padding:.72rem;border:none;border-radius:.6rem;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:.65rem;color:white}
.sbtn.pack{background:#1D9E75}.sbtn.flight{background:#378ADD}
.sbtn.hotel{background:#D85A30}.sbtn.reserve{background:#9B59B6}

.bsovr{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:800}
.bsovr.open{display:block}
.bsheet{position:fixed;bottom:0;left:0;right:0;background:white;border-radius:1rem 1rem 0 0;z-index:810;padding:.6rem 1rem 2.5rem;display:none;box-shadow:0 -4px 24px rgba(0,0,0,.14)}
.bsheet.open{display:block}
.bs-handle{width:2.2rem;height:.22rem;background:#ddd;border-radius:99px;margin:.1rem auto .75rem}
.bs-title{font-size:.65rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.65rem}
.pkrow{display:flex;align-items:center;gap:.65rem;padding:.72rem .5rem;border-radius:.6rem;cursor:pointer;margin-bottom:.1rem}
.pkrow:active{background:#f5f0e8}
.pkrow.active{background:#f0fdf8}
.pkdot{width:.9rem;height:.9rem;border-radius:50%;flex-shrink:0}
.pkname{flex:1;font-size:.95rem;font-weight:500;color:#111}
.pkrow.active .pkname{font-weight:700}
.pkcheck{font-size:.95rem;color:#1D9E75}
.mgrlist{list-style:none;margin-bottom:.7rem}
.mgritem{display:flex;align-items:center;gap:.5rem;padding:.6rem .1rem;border-bottom:.5px solid #f0ede6}
.mgritem:last-child{border-bottom:none}
.mgrdot{width:.9rem;height:.9rem;border-radius:50%;flex-shrink:0}
.mgrname{flex:1;font-size:.85rem;color:#111;font-weight:500}
.mgr-edit-inp{flex:1;border:2px solid #378ADD;border-radius:.4rem;padding:.25rem .45rem;font-size:.8rem;background:white;font-family:inherit;color:#111;outline:none}
.mgr-confirm{background:#1D9E75;border:none;color:white;font-size:.72rem;font-weight:700;cursor:pointer;padding:.28rem .55rem;border-radius:.4rem;white-space:nowrap;display:flex;align-items:center;gap:.2rem}
.mgrbtn-edit{background:none;border:none;color:#888;font-size:1rem;cursor:pointer;padding:.12rem .22rem}
.mgrbtn-del{background:none;border:none;color:#E53935;font-size:1rem;cursor:pointer;padding:.12rem .22rem}
.t-split.active{border-top-color:#7A4F0B}
.split-screen{background:#f5f0e8;min-height:100vh;display:flex;flex-direction:column}
.split-hdr{padding:10px 14px 8px;border-bottom:1px solid #cdc7bb;display:flex;align-items:center;justify-content:space-between;background:#f5f0e8}
.split-htitle{font-size:12px;font-weight:700;color:#7A4F0B;letter-spacing:.08em;text-transform:uppercase}
.split-add{background:none;border:none;font-size:14px;font-weight:700;color:#7A4F0B;cursor:pointer;padding:2px 0}
.split-tog{display:flex;margin:2px 12px 8px;border:1px solid #cdc7bb;border-radius:8px;overflow:hidden;background:#ede7d9}
.stog-btn{flex:1;padding:7px;text-align:center;font-size:12px;font-weight:600;border:none;background:none;cursor:pointer;color:#a89880}
.stog-btn.on{background:#7A4F0B;color:#fff}
.split-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px 12px 6px}
.sstat{background:#ede7d9;border-radius:8px;padding:8px 10px;border:0.5px solid #cdc7bb}
.sstat-lbl{font-size:9px;color:#8a7a60;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-weight:600}
.sstat-val{font-size:17px;font-weight:700;color:#2c2010}
.ssort{background:#ede7d9;border-radius:8px;padding:8px 10px;cursor:pointer;border:0.5px solid #cdc7bb;position:relative}
.ssort-lbl{font-size:9px;color:#8a7a60;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-weight:600}
.ssort-val{font-size:12px;font-weight:700;color:#7A4F0B;display:flex;align-items:center;gap:3px}
.ssort-opt{display:none}
.exp-list{flex:1;padding:0}
.exp-row{padding:12px 14px;border-bottom:0.5px solid #cdc7bb}
.exp-row:nth-child(odd){background:#f5f0e8}
.exp-row:nth-child(even){background:#ede7d9}
.er-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.er-desc{font-size:15px;font-weight:700;color:#1a120a;flex:1}
.er-amt{font-size:16px;font-weight:700;color:#7A4F0B;white-space:nowrap}
.er-meta{font-size:12px;color:#5a4a38;display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.er-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.er-splits{font-size:11px;color:#7a6a58;margin-top:5px;line-height:1.5}
.er-del{font-size:1.2rem;color:#c0392b;background:none;border:none;cursor:pointer;padding:.4rem .5rem;flex-shrink:0;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.net-banner{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 4px}
.net-card{border-radius:8px;padding:8px 10px;text-align:center;border:0.5px solid #cdc7bb}
.net-card.pos{background:#d4edda;border-color:#a8d5b5}
.net-card.neg{background:#fde8e8;border-color:#f5b8b8}
.net-card.zer{background:#ede7d9;border-color:#cdc7bb}
.net-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.net-card.pos .net-name{color:#145214}
.net-card.neg .net-name{color:#7a0000}
.net-card.zer .net-name{color:#4a3c2c}
.net-amt{font-size:20px;font-weight:700}
.net-card.pos .net-amt{color:#145214}
.net-card.neg .net-amt{color:#a93226}
.net-card.zer .net-amt{color:#4a3c2c}
.net-sub{font-size:12px;margin-top:3px;font-weight:600}
.net-card.pos .net-sub{color:#1B5E20}
.net-card.neg .net-sub{color:#922b21}
.net-card.zer .net-sub{color:#5a4a38}
.paid-banner{padding:8px 12px;border-top:0.5px solid #cdc7bb;border-bottom:0.5px solid #cdc7bb;background:#f5f0e8}
.paid-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.paid-item{font-size:11px;color:#5a4a38;display:flex;align-items:center;gap:4px}
.paid-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.paid-lbl{font-weight:700}
.settle-list{padding:0}
.settle-hdr{font-size:10px;font-weight:700;color:#8a7a60;text-transform:uppercase;letter-spacing:.05em;padding:8px 14px 4px}
.settle-row{padding:12px 14px;border-bottom:0.5px solid #cdc7bb;display:flex;align-items:center;gap:8px}
.settle-row:nth-child(odd){background:#f5f0e8}
.settle-row:nth-child(even){background:#ede7d9}
.settle-from{font-size:14px;font-weight:700;color:#1a120a;display:flex;align-items:center;gap:5px}
.settle-arrow{color:#cdc7bb;font-size:16px}
.settle-to{font-size:14px;font-weight:700;color:#1a120a;display:flex;align-items:center;gap:5px}
.settle-total{font-size:20px;font-weight:700;color:#1B5E20;margin-left:auto}
.settle-fdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.split-empty{padding:2rem 1.5rem;text-align:center;color:#8a7a60;font-size:13px;background:#f5f0e8}
.er-edit{background:none;border:none;color:#7A4F0B;font-size:1.2rem;cursor:pointer;padding:.4rem .5rem;flex-shrink:0;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.er-del{background:none;border:none;color:#c0392b;font-size:1rem;cursor:pointer;padding:.1rem .25rem;flex-shrink:0}
.er-ppl{font-size:11px;color:#5a4a38;margin-top:5px;line-height:1.5}
.kp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:none}
.kp-overlay.open{display:block}
.kp-sheet{position:fixed;top:0;left:0;right:0;bottom:0;width:min(96vw,420px);margin:auto;height:fit-content;max-height:92vh;background:#0d2b1f;border-radius:16px;z-index:910;display:none;padding:0 0 16px;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.55)}
.kp-sheet.open{display:block}
.kp-handle{width:32px;height:3px;background:rgba(255,255,255,.2);border-radius:99px;margin:10px auto 0}
.kp-fields{padding:8px 12px 4px;display:flex;flex-direction:column;gap:6px}
.kp-top-row{display:grid;grid-template-columns:1fr 90px;gap:6px}
.kp-box{background:#1e4a34;border:1.5px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 11px;cursor:pointer}
.kp-box.active{border-color:#e8c84a}
.kp-lbl{font-size:9px;color:rgba(255,255,255,.75);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;font-weight:700}
.kp-amt-inner{display:flex;align-items:baseline;justify-content:space-between}
.kp-amt-disp{display:flex;align-items:baseline;gap:3px}
.kp-sym{font-size:16px;color:#f0e080;font-weight:700;line-height:2}
.kp-num{font-size:32px;font-weight:700;color:#f0e080;line-height:1}
.kp-curr{display:flex;border:1px solid rgba(255,255,255,.15);border-radius:5px;overflow:hidden;align-self:flex-start}
.kp-cb{padding:4px 7px;font-size:11px;font-weight:700;border:none;background:none;cursor:pointer;color:rgba(255,255,255,.75)}
.kp-cb.on{background:#e8c84a;color:#0d2b1f}
.kp-date-val{font-size:15px;font-weight:700;color:#ffffff;line-height:1.2}
.kp-date-time{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px;font-weight:600}
.kp-cats{display:flex;gap:5px;margin-top:3px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.kp-cat{padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid rgba(255,255,255,.5);color:rgba(255,255,255,.85);background:rgba(255,255,255,.08);cursor:pointer;white-space:nowrap;flex-shrink:0}
.kp-cat.on{background:#e8c84a;color:#0d2b1f;border-color:#e8c84a;font-weight:600}
.kp-desc{background:none;border:none;outline:none;color:#ffffff;font-size:13px;width:100%;font-family:inherit;margin-top:5px;border-top:1px solid rgba(255,255,255,.3);padding-top:5px;font-weight:500}
.kp-desc::placeholder{color:rgba(255,255,255,.5)}
.kp-paidby{display:flex;gap:5px;margin-top:3px}
.kp-pb{padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid rgba(255,255,255,.5);color:rgba(255,255,255,.85);background:rgba(255,255,255,.08);cursor:pointer;white-space:nowrap}
.kp-pb.on-j{background:#534AB7;border-color:#534AB7;color:#fff;font-weight:600}
.kp-pb.on-m{background:#993C1D;border-color:#993C1D;color:#fff;font-weight:600}
.kp-pb.on-s{background:#854F0B;border-color:#854F0B;color:#fff;font-weight:600}
.kp-splitgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:4px}
/* 4-col grid used when Matthews is present to show J&J box */
.kp-splitgrid-jj{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:4px}
.kp-sbox{background:#2a5040;border:1.5px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 5px;text-align:center;cursor:pointer}
.kp-sbox.active{border-color:#e8c84a;background:#1a3d2b}
.kp-sbox.kp-soff{opacity:.38}
/* J&J box — rust tint to visually separate from family boxes */
.kp-sbox-jj{background:#3a2010;border:1.5px solid rgba(255,180,120,.35);border-radius:8px;padding:7px 5px;text-align:center;cursor:pointer}
.kp-sbox-jj.active{border-color:#e8c84a;background:#2a1408}
.kp-sbox-jj.kp-soff{opacity:.38}
.kp-sname{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.85);margin-bottom:3px;font-weight:700}
.kp-sppl{font-size:26px;font-weight:700;color:#ffffff;line-height:1}
.kp-sbox.active .kp-sppl{color:#e8c84a}
.kp-sbox-jj.active .kp-sppl{color:#e8c84a}
.kp-splbl{font-size:9px;color:rgba(255,255,255,.65);margin-top:1px}
.kp-samt{font-size:12px;color:#f0e080;margin-top:4px;font-weight:700;min-height:13px}
.kp-sbox.kp-soff .kp-samt{color:rgba(255,255,255,.15)}
.kp-sbox-jj.kp-soff .kp-samt{color:rgba(255,255,255,.15)}
.kp-shint{font-size:8px;color:rgba(255,255,255,.18);margin-top:2px}
.kp-sbox.active .kp-shint{color:#e8c84a;opacity:.6}
.kp-sbox-jj.active .kp-shint{color:#e8c84a;opacity:.6}
/* Expense row J&J sub-line */
.jj-subledger{font-size:11px;color:#7a6a58;margin-top:4px;padding:4px 8px;background:rgba(153,60,29,.08);border-left:3px solid #993C1D;border-radius:0 4px 4px 0;line-height:1.5}
/* Summary J&J internal settle row */
.jj-settle-row{padding:10px 14px;border-bottom:0.5px solid #cdc7bb;display:flex;align-items:center;gap:8px;background:#fff8f5}
.jj-settle-badge{font-size:10px;font-weight:700;background:#FFCCBC;color:#8B1A00;border-radius:4px;padding:2px 7px;margin-left:auto;white-space:nowrap}
.kp-hint{font-size:11px;color:rgba(255,255,255,.7);text-align:center;padding:3px 0 1px;font-weight:600}
.kp-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:6px 14px}
.kp-key{height:54px;border-radius:10px;border:none;font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#ffffff;background:#5a8a70;letter-spacing:-.01em}
.kp-key.del{background:#c0392b}
.kp-key.dot{font-size:22px;color:#ffffff;font-weight:700}
.kp-cfm{margin:5px 12px 2px;height:50px;border-radius:12px;border:none;background:#e8c84a;color:#0d2b1f;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px)}
/* ---- Add Expense: fix date / category / paidby proportions ---- */
.kp-top-row{grid-template-columns:1fr 100px}
.kp-cats{justify-content:stretch}
.kp-cat{flex:1;text-align:center;padding:5px 4px}
.kp-paidby{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kp-pb{text-align:center;padding:5px 4px;border-radius:6px}
/* ---- Add Reservation navy sheet — HIGH CONTRAST v2 ---- */
.rv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;display:none}
.rv-overlay.open{display:block}
.rv-sheet{position:fixed;bottom:0;left:0;right:0;width:min(100vw,480px);margin:0 auto;max-height:93vh;background:#0f1e3a;border-radius:20px 20px 0 0;z-index:1110;display:none;overflow-y:auto;box-shadow:0 -6px 40px rgba(0,0,0,.7)}
.rv-sheet.open{display:block}
.rv-handle{width:34px;height:4px;background:rgba(255,255,255,.35);border-radius:99px;margin:10px auto 0}
.rv-head{display:flex;align-items:center;padding:10px 15px 8px;position:sticky;top:0;background:#0f1e3a;z-index:2;border-bottom:1px solid rgba(255,255,255,.12)}
.rv-title{font-size:12px;font-weight:700;color:#f0c040;letter-spacing:.09em;text-transform:uppercase;flex:1}
.rv-close{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.rv-close i{color:#fff;font-size:15px}
.rv-body{padding:10px 14px 24px}
.rv-card{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:11px 13px;margin-bottom:10px}
.rv-lbl{font-size:10px;color:rgba(255,255,255,.7);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;font-weight:700}
/* type buttons */
.rv-type-row{display:flex;gap:5px}
.rv-type-btn{flex:1;min-width:0;padding:9px 2px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);font-size:10px;color:rgba(255,255,255,.7);text-align:center;cursor:pointer;-webkit-appearance:none;line-height:1.3}
.rv-type-btn i{display:block;font-size:14px;margin-bottom:3px;color:rgba(255,255,255,.6)}
.rv-type-btn.rv-on{background:rgba(255,255,255,.22);border-color:#f0c040;color:#fff;font-weight:600}
.rv-type-btn.rv-on i{color:#f0c040}
/* two-col */
.rv-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
.rv-field{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 11px;cursor:pointer}
.rv-field-val{font-size:13px;color:#fff;font-weight:500}
.rv-field-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.rv-field-ph{font-size:13px;color:rgba(255,255,255,.45)}
.rv-inp{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 12px;font-size:13px;color:#fff;font-family:inherit;outline:none;-webkit-appearance:none}
.rv-inp:focus{border-color:#f0c040;background:rgba(255,255,255,.14)}
.rv-inp::placeholder{color:rgba(255,255,255,.4)}
.rv-inp[type=datetime-local]{color:#fff;font-size:12px;font-weight:500}
.rv-ta{resize:none;min-height:2.6rem;line-height:1.45}
/* family buttons */
.rv-fam-row{display:flex;gap:7px}
.rv-fam-btn{flex:1;padding:12px 4px;border-radius:11px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);font-size:13px;font-weight:600;color:rgba(255,255,255,.75);text-align:center;cursor:pointer;min-height:46px;display:flex;align-items:center;justify-content:center}
.rv-fam-btn.rv-fam-all{background:rgba(80,200,110,.28);border-color:rgba(80,200,110,.7);color:#7fffa0}
.rv-fam-btn.rv-fam-part{background:rgba(240,192,64,.25);border-color:rgba(240,192,64,.6);color:#f0c040}
/* member dropdown */
.rv-dd{background:#162440;border:1px solid rgba(255,255,255,.22);border-radius:11px;margin-top:8px;overflow:hidden}
.rv-dd-all{display:flex;align-items:center;gap:8px;padding:11px 13px;background:rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:600;color:#f0c040;cursor:pointer;min-height:46px}
.rv-dd-item{display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:13px;color:#fff;cursor:pointer;border-bottom:.5px solid rgba(255,255,255,.08);min-height:46px}
.rv-dd-item:last-child{border-bottom:none}
.rv-chk{width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(255,255,255,.4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.rv-chk.rv-chk-on{background:#4caf72;border-color:#4caf72;color:#fff}
/* optional badge */
.rv-opt{font-size:10px;background:rgba(240,192,64,.22);color:#f0c040;border:1px solid rgba(240,192,64,.45);border-radius:6px;padding:2px 7px;font-weight:600;flex-shrink:0}
/* currency toggle */
.rv-cur{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:8px;overflow:hidden}
.rv-cur-btn{padding:5px 11px;font-size:12px;font-weight:700;border:none;background:transparent;cursor:pointer;color:rgba(255,255,255,.55)}
.rv-cur-btn.rv-cur-on{background:#f0c040;color:#0f1e3a}
/* amount display */
.rv-amt-big{font-size:30px;font-weight:500;color:#f0c040;letter-spacing:-0.5px;margin:5px 0 3px}
.rv-amt-hint{font-size:11px;color:rgba(255,255,255,.5)}
/* paid by */
.rv-pb-row{display:flex;gap:7px}
.rv-pb-btn{flex:1;padding:12px 4px;border-radius:11px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);font-size:13px;font-weight:600;color:rgba(255,255,255,.75);text-align:center;cursor:pointer;min-height:46px;display:flex;align-items:center;justify-content:center}
.rv-pb-btn.rv-pb-on{background:rgba(99,153,255,.3);border-color:rgba(99,153,255,.65);color:#c0d8ff}
/* skip cost button */
.rv-skip-btn{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);font-size:12px;color:rgba(255,255,255,.55);cursor:pointer;margin-top:6px;text-align:center}
/* note */
.rv-split-note{font-size:10px;color:rgba(255,255,255,.4);text-align:center;padding:5px 0 7px}
/* action row */
.rv-act-row{display:flex;gap:9px;margin-top:12px}
.rv-act-btn{flex:1;padding:16px 4px;border-radius:13px;font-size:15px;font-weight:600;text-align:center;border:none;cursor:pointer;min-height:52px}
.rv-act-del{background:rgba(220,60,60,.25);color:#ff9090;border:1px solid rgba(220,60,60,.45)}
.rv-act-save{background:#f0c040;color:#0f1e3a}
/* reservation keypad */
.rv-kp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1200;display:none}
.rv-kp-overlay.open{display:block}
.rv-kp-sheet{position:fixed;bottom:0;left:0;right:0;width:min(100vw,480px);margin:0 auto;background:#0f1e3a;border-radius:20px 20px 0 0;z-index:1210;display:none;padding:0 14px 24px;box-shadow:0 -6px 40px rgba(0,0,0,.7)}
.rv-kp-sheet.open{display:block}
.rv-kp-handle{width:34px;height:4px;background:rgba(255,255,255,.3);border-radius:99px;margin:10px auto 10px}
.rv-kp-disp{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:13px;padding:13px 15px;margin-bottom:11px}
.rv-kp-lbl{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;font-weight:700}
.rv-kp-num{font-size:34px;font-weight:500;color:#f0c040;letter-spacing:-1px}
.rv-kp-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.rv-kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.rv-kp-key{height:58px;border-radius:12px;border:none;font-size:26px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;background:#1e3a6a}
.rv-kp-key:active{filter:brightness(1.2)}
.rv-kp-key.rv-kp-del{background:#8b1a1a}
.rv-kp-save{height:54px;border-radius:13px;border:none;background:#f0c040;color:#0f1e3a;font-size:15px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
/* ---- Flight sheet (dark blue-gray) ---- */
.fl-sheet-bg{background:#1a2030}
.fl-card{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:11px 13px;margin-bottom:10px}
.fl-lbl{font-size:10px;color:rgba(255,255,255,.7);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;font-weight:700;display:block}

.fl-inp:focus{border-color:#60a0ff;background:rgba(255,255,255,.14)}
.fl-inp::placeholder{color:rgba(255,255,255,.4)}
.fl-ta{resize:none;min-height:2.6rem;line-height:1.45}
.fl-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}

.fl-tog-btn{flex:1;padding:10px 4px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);text-align:center}
.fl-tog-btn.fl-on{background:#378ADD;color:#fff}
.fl-pax-tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fl-fam-grp{margin-bottom:8px}
.fl-fam-grp-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:block}
.fl-tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);cursor:pointer;min-width:3rem}
.fl-tile.fl-sel{border-color:#60a0ff;background:rgba(60,140,255,.2)}
.fl-tile i{font-size:1rem;color:rgba(255,255,255,.6)}
.fl-tile.fl-sel i{color:#60a0ff}
.fl-tile span{font-size:.5rem;font-weight:600;color:rgba(255,255,255,.7)}
.fl-ins-wrap{display:none}
.fl-save{width:100%;padding:15px;border:none;border-radius:13px;background:#378ADD;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;min-height:52px}
.fl-del{width:100%;padding:11px;border:1px solid rgba(220,60,60,.5);border-radius:13px;background:rgba(220,60,60,.15);color:#ff9090;font-size:13px;cursor:pointer;margin-top:8px}
/* ---- Accommodation sheet (warm tan/gray neutral) ---- */
.ac-sheet-bg{background:#24201a}
.ac-card{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:11px 13px;margin-bottom:10px}
.ac-lbl{font-size:10px;color:rgba(255,255,255,.7);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;font-weight:700;display:block}
.ac-inp{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 12px;font-size:13px;color:#fff;font-family:inherit;outline:none;-webkit-appearance:none}
.ac-inp:focus{border-color:#D85A30;background:rgba(255,255,255,.14)}
.ac-inp::placeholder{color:rgba(255,255,255,.4)}
.ac-ta{resize:none;min-height:2.6rem;line-height:1.45}
.ac-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
.ac-type-row{display:flex;gap:5px}
.ac-type-btn{flex:1;min-width:0;padding:9px 3px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.7);text-align:center;cursor:pointer}
.ac-type-btn i{display:block;font-size:14px;margin-bottom:3px;color:rgba(255,255,255,.6)}

.ac-fam-tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ac-fam-grp{margin-bottom:8px}
.ac-fam-grp-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:block}
.ac-tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);cursor:pointer;min-width:3rem}
.ac-tile.ac-sel{border-color:#D85A30;background:rgba(216,90,48,.2)}
.ac-tile i{font-size:1rem;color:rgba(255,255,255,.6)}
.ac-tile.ac-sel i{color:#D85A30}
.ac-tile span{font-size:.5rem;font-weight:600;color:rgba(255,255,255,.7)}
.ac-save{width:100%;padding:15px;border:none;border-radius:13px;background:#D85A30;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;min-height:52px}
.ac-del{width:100%;padding:11px;border:1px solid rgba(220,60,60,.5);border-radius:13px;background:rgba(220,60,60,.15);color:#ff9090;font-size:13px;cursor:pointer;margin-top:8px}
/* ---- Add Expense date picker fix ---- */
.kp-date-picker{width:100%;background:transparent;border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;outline:none;font-family:inherit;-webkit-appearance:none;padding:0}
.kp-date-picker::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer;opacity:.7}
</style>

    <div class="ftile" onclick="pickFamily('matthews')"><span class="ftile-ico">&#x1F985;</span><span class="ftile-name">Matthews</span><span class="ftile-sub">Nick &middot; Christine &middot; Reagan<br>Lincoln &middot; Nixon</span></div>
    <div class="ftile" onclick="pickFamily('silvermans')"><span class="ftile-ico">&#x2B50;</span><span class="ftile-name">Silvermans</span><span class="ftile-sub">Josh &middot; Lori<br>Mikayla &middot; Zach</span></div>

<script>
var SB_URL='https://dehktexgwfurefdihtfn.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlaGt0ZXhnd2Z1cmVmZGlodGZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzExMjUsImV4cCI6MjA5NTY0NzEyNX0.pEwh8Q26c6NosCD_MnTe4zBHmwUmGuTo_a-wF56ObtI';

var sb=supabase.createClient(SB_URL,SB_KEY,{realtime:{enabled:false}});
var FIDS={
  jmcr:'a1000000-0000-0000-0000-000000000001',
  matthews:'a2000000-0000-0000-0000-000000000002',
  silvermans:'a3000000-0000-0000-0000-000000000003'
};
// J&J are individual Matthews guest members (John & Jody).
// Their share is tracked as family_key='jj' in expense_splits.
// Included in Matthews' inter-family total; shown as sub-ledger in UI.
var JJ_KEY='jj';
var COLORS=[
  {bg:'#E8F5E9',ic:'#1B5E20'},{bg:'#E3F2FD',ic:'#0D47A1'},
  {bg:'#FCE4EC',ic:'#880E4F'},{bg:'#FFF3E0',ic:'#E65100'},
  {bg:'#F3E5F5',ic:'#4A148C'},{bg:'#E0F7FA',ic:'#006064'},
  {bg:'#FFF9C4',ic:'#F57F17'},{bg:'#EFEBE9',ic:'#4E342E'}
];
var RYAN_COLORS={
  Backpack:{bg:'#EEEDFE',ic:'#5048BE'},
  Meds:    {bg:'#FCE4EC',ic:'#880E4F'},
  Equip:   {bg:'#E3F2FD',ic:'#0D47A1'}
};
var S={
  fkey:null,fid:null,fname:null,isJMCR:false,
  user:null,sel:null,tab:'pack',
  trip:null,members:[],allMembers:[],cats:[],items:[],
  flights:[],hotels:[],reserves:[],rsubs:[],companions:[],
  expenses:[],exRate:1.09,splitView:'expenses',sortBy:'date',
  jjMemberIds:[],
  kp:{open:false,focus:'amount',amount:'',currency:'USD',cat:'Food',paidBy:'jmcr',desc:'',jmcrN:0,mattN:0,silvN:0,jjN:0,currDigits:''},
  rv:{open:false,editId:null,resType:'Restaurant',dt:'',name:'',location:'',notes:'',amount:'',currency:'USD',paidBy:null,
      famSel:{jmcr:'all',matthews:'none',silvermans:'none'},
      memSel:{},ddOpen:null,kpOpen:false,kpDigits:'',savedDt:''}
};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDT(dt){if(!dt)return'-';return new Date(dt).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});}
function fmtD(dt){if(!dt)return'-';return new Date(dt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function past(dt){return dt&&new Date(dt)<new Date();}
function sdot(s){var el=document.getElementById('sdot');if(el)el.className='sdot tb-sdot'+(s?' '+s:'');}
function col(m,i){return{bg:m.bg_color||COLORS[i%COLORS.length].bg,ic:m.icon_color||COLORS[i%COLORS.length].ic};}
function V(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function DR(l,v){return'<div class="drow"><span class="dlbl">'+l+'</span><span class="dval">'+esc(String(v||'-'))+'</span></div>';}

// Identify J&J member IDs from allMembers — Matthews guests named John or Jody
function resolveJJMembers(){
  S.jjMemberIds=S.allMembers.filter(function(m){
    if(m.family_id!==FIDS.matthews)return false;
    var n=(m.name||'').toLowerCase();
    return n==='john'||n==='jody'||n.indexOf('john')===0||n.indexOf('jody')===0;
  }).map(function(m){return m.id;});
}
function showLoad(){document.getElementById('fscreen').classList.add('hide');document.getElementById('lscreen').classList.remove('hide');document.getElementById('app').style.display='none';}
function showApp(){document.getElementById('fscreen').classList.add('hide');document.getElementById('lscreen').classList.add('hide');document.getElementById('app').style.display='block';}
function showFamScreen(){document.getElementById('fscreen').classList.remove('hide');document.getElementById('lscreen').classList.add('hide');document.getElementById('app').style.display='none';}

function nowLocal(){
  var d=new Date();
  var pad=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
    +'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function toLocalDT(utcStr){
  if(!utcStr)return'';
  var d=new Date(utcStr);
  var pad=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
    +'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function pickFamily(key){
  S.fkey=key;S.fid=FIDS[key];S.isJMCR=(key==='jmcr');
  S.fname=key==='jmcr'?'JMCR':key==='matthews'?'Matthews':'Silvermans';
  S.tab='pack';S.user=null;S.sel=null;
  S.rsubs.forEach(function(r){if(r._iv)clearInterval(r._iv);});S.rsubs=[];
  localStorage.setItem('fkey',key);showLoad();loadAll();
}
function switchFam(){
  S.rsubs.forEach(function(r){if(r._iv)clearInterval(r._iv);});S.rsubs=[];
  localStorage.removeItem('fkey');showFamScreen();
}

function loadAll(){
  sb.from('members').select('*').eq('family_id',S.fid).order('display_order')
  .then(function(r){
    S.members=r.data||[];
    var pk=S.members.filter(function(m){return!m.is_subject;});
    S.user=pk[0]||null;
    S.sel=S.isJMCR?{type:'ryan',sub:'Backpack'}:{type:'member',member:pk[0]||null};
    sb.from('members').select('*,families(name)').order('family_id').order('display_order')
    .then(function(r2){
      S.allMembers=r2.data||[];
      resolveJJMembers();
      sb.from('categories').select('*').eq('family_id',S.fid).order('display_order')
      .then(function(r3){
        S.cats=r3.data||[];
        sb.from('trips').select('*').eq('family_id',S.fid).eq('is_active',true).limit(1)
        .then(function(r4){
          S.trip=r4.data&&r4.data[0]||null;
          var p=S.trip?sb.from('checklist_items').select('*').eq('trip_id',S.trip.id):Promise.resolve({data:[]});
          p.then(function(r5){
            S.items=r5.data||[];
            sb.from('flights').select('*,flight_passengers(*,members(name,icon,icon_color))').order('departure_dt')
            .then(function(r6){
              S.flights=r6.data||[];
              sb.from('accommodations').select('*,accommodation_guests(*,members(name,icon,icon_color))').order('check_in_dt')
              .then(function(r7){
                S.hotels=r7.data||[];
                sb.from('reservations').select('*,reservation_guests(*,members(name,icon,icon_color))').order('reservation_dt')
                .then(function(r8){
                  S.reserves=r8.data||[];
                  sb.from('app_state').select('*').eq('family_id',S.fid).limit(1)
                  .then(function(r9){
                    var as=r9.data&&r9.data[0];
                    if(as){
                      S.tab=as.active_tab||'pack';
                      if(S.tab==='ryan'||S.tab==='family')S.tab='pack';
                      var pk2=S.members.filter(function(m){return!m.is_subject;});
                      if(S.isJMCR&&as.active_sub&&RYAN_COLORS[as.active_sub]){
                        S.sel={type:'ryan',sub:as.active_sub};
                      }else{
                        var sm=pk2.find(function(m){return m.id===as.active_member;});
                        if(sm)S.sel={type:'member',member:sm};
                      }
                    }
                    var iv=setInterval(function(){
                      if(!S.trip)return;
                      sb.from('checklist_items').select('*').eq('trip_id',S.trip.id)
                      .then(function(rp){S.items=rp.data||[];var kps=document.getElementById('kpSheet');if(!kps||!kps.classList.contains('open'))renderPanel();updateProg();});
                    },10000);
                    S.rsubs.push({_iv:iv});
                    fetch('https://open.er-api.com/v6/latest/EUR').then(function(r){return r.json();}).then(function(d){S.exRate=(d&&d.rates&&d.rates.USD)||1.09;}).catch(function(){S.exRate=1.09;});
                    if(S.trip){loadExpenses(function(exps){S.expenses=exps;showApp();render();});}else{showApp();render();}
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}

function render(){
  document.getElementById('hBadge').textContent=S.fname;
  renderToolbar();renderNav();renderPanel();updateProg();
}

function renderToolbar(){
  var tb=document.getElementById('toolbar');
  tb.innerHTML='';
  var btn=document.createElement('button');
  btn.className='tb-packer';
  btn.setAttribute('aria-label','Switch packer');
  var nameSpan='';
  if(S.user){
    var pk=S.members.filter(function(m){return!m.is_subject;});
    var ci=pk.indexOf(S.user);var cc=col(S.user,ci<0?0:ci);
    nameSpan='<span class="tb-packer-name" style="background:'+cc.bg+';color:'+cc.ic+'">'+esc(S.user.name)+'</span>';
  }
  btn.innerHTML='<i class="ti ti-users tb-packer-ico" aria-hidden="true"></i>'
    +'<div class="tb-vchev"><i class="ti ti-chevron-up" aria-hidden="true"></i><i class="ti ti-chevron-down" aria-hidden="true"></i></div>'
    +nameSpan;
  btn.onclick=function(){openPackerSheet();};
  tb.appendChild(btn);
  var sp=document.createElement('div');sp.className='tb-spacer';tb.appendChild(sp);
  var sdotEl=document.createElement('span');sdotEl.id='sdot';sdotEl.className='sdot tb-sdot';tb.appendChild(sdotEl);
  var pencil=document.createElement('button');
  pencil.className='tb-pencil';pencil.setAttribute('aria-label','Manage members');
  pencil.innerHTML='<i class="ti ti-pencil" aria-hidden="true"></i>';
  pencil.onclick=function(){openMemberMgr();};
  tb.appendChild(pencil);
}

function openPackerSheet(){
  var pk=S.members.filter(function(m){return!m.is_subject;});
  var rows='';
  pk.forEach(function(m,i){
    var c=col(m,i);var isAct=S.user&&S.user.id===m.id;
    rows+='<div class="pkrow'+(isAct?' active':'')+'" data-pkid="'+m.id+'">'
      +'<div class="pkdot" style="background:'+c.ic+'"></div>'
      +'<span class="pkname">'+esc(m.name)+'</span>'
      +(isAct?'<i class="ti ti-check pkcheck" aria-hidden="true"></i>':'')
      +'</div>';
  });
  document.getElementById('bsBody').innerHTML='<div class="bs-title">Packing as</div>'+rows;
  document.getElementById('bsovr').classList.add('open');
  document.getElementById('bsheet').classList.add('open');
}
function closeBS(){
  document.getElementById('bsovr').classList.remove('open');
  document.getElementById('bsheet').classList.remove('open');
}

function renderNav(){
  var nav=document.getElementById('nav');nav.innerHTML='';
  var tabs=[
    {id:'pack',lbl:'Pack List',ico:'ti-briefcase',cls:'t-pack'},
    {id:'flight',lbl:'Flight',ico:'ti-plane',cls:'t-flight'},
    {id:'hotel',lbl:'Hotel',ico:'ti-building',cls:'t-hotel'},
    {id:'reservations',lbl:'Schedules',ico:'ti-calendar-event',cls:'t-reserve'},

function sortedItems(arr){
  function alpha(a,b){return(a.text||'').localeCompare(b.text||'');}
  var a=arr.filter(function(i){return!i.is_done&&!i.is_skipped;}).sort(alpha);
  var s=arr.filter(function(i){return i.is_skipped;}).sort(alpha);
  var d=arr.filter(function(i){return i.is_done;}).sort(alpha);
  return a.concat(s,d);
}

function irow(item,showStamp){
  var st=showStamp?S.allMembers.find(function(m){return m.id===item.done_by;}):null;
  var stamp=st?'<span class="istamp" style="background:'+(st.icon_color||'#ccc')+'22;color:'+(st.icon_color||'#888')+'">'+esc(st.name)+'</span>':'';
  var skip=item.is_skipped?'<span class="iskip">skip</span>':'';
  var undo=item.is_done?'<button class="iundo" data-id="'+item.id+'">Undo</button>':'';
  return '<li class="irow'+(item.is_done?' done':'')+(item.is_skipped?' skip':'')+'">'
    +'<button class="ichk'+(item.is_done?' on':'')+'" data-id="'+item.id+'">'+(item.is_done?'<i class="ti ti-check" aria-hidden="true"></i>':'')+'</button>'
    +'<div style="flex:1;min-width:0"><div class="itxt'+(item.is_done?' struck':'')+(item.is_skipped?' skp':'')+'">'+esc(item.text)+'</div>'+undo+'</div>'
    +stamp+skip
    +'<button class="idot" data-id="'+item.id+'"><i class="ti ti-dots-vertical" aria-hidden="true"></i></button>'
    +'</li>';
}

function updateProg(){
  if(!S.isJMCR){document.getElementById('pl').textContent='';document.getElementById('pb').style.width='0%';return;}
  var tot=0,dn=0;
  S.cats.forEach(function(c){
    S.items.filter(function(i){return i.category_id===c.id&&!i.is_skipped;}).forEach(function(){tot++;});
    S.items.filter(function(i){return i.category_id===c.id&&i.is_done;}).forEach(function(){dn++;});
  });
  var pct=tot?Math.round(dn/tot*100):0;
  document.getElementById('pb').style.width=pct+'%';
  document.getElementById('pl').textContent='Ryan: '+dn+'/'+tot+' ('+pct+'%)';
}

function openAddReservation(r){
  var isEdit=r&&r.id;
  S.rv={
    open:true,
    editId:isEdit?r.id:null,
    resType:isEdit?(r.res_type||'Restaurant'):'Restaurant',
    dt:isEdit?toLocalDT(r.reservation_dt):(S.rv&&S.rv.savedDt?S.rv.savedDt:nowLocal()),
    endDt:isEdit?(toLocalDT(r.end_dt)||''):'',
    name:isEdit?(r.name||''):'',
    location:isEdit?(r.location||''):'',
    notes:isEdit?(r.notes||''):'',
    amount:isEdit&&(r.amount!=null&&r.amount!=='')?(String(parseFloat(r.amount))):'',
    currency:isEdit?(r.currency||'USD'):'USD',
    paidBy:isEdit?(r.paid_by_family||null):null,
    costSkipped:isEdit?!!(r.cost_skipped):false,
    famSel:{jmcr:'none',matthews:'none',silvermans:'none'},
    memSel:{},
    ddOpen:null,
    kpOpen:false,
    kpDigits:'0',
    savedDt:S.rv&&S.rv.savedDt?S.rv.savedDt:''
  };
  if(isEdit){
    var guests=r.reservation_guests||[];
    var fkeys=['jmcr','matthews','silvermans'];
    fkeys.forEach(function(fk){
      rvFamMembers(fk).forEach(function(m){
        if(guests.find(function(g){return g.member_id===m.id;})){S.rv.memSel[m.id]=true;}
      });
    });
  }else{
    S.allMembers.filter(function(m){return!m.is_subject;}).forEach(function(m){S.rv.memSel[m.id]=true;});
  }
  var sheet=document.getElementById('rvSheet');
  var ovr=document.getElementById('rvOverlay');

  sheet.classList.add('open');
  ovr.classList.add('open');

}

function rvGetDt(dateId,timeId,fallback){var d=document.getElementById(dateId);var t=document.getElementById(timeId);var dv=d?d.value:'';var tv=t?t.value:'';if(dv)return dv+'T'+(tv||'00:00');return fallback||'';}
function rvRefresh(){

function bindRvSheet(){
  var closeBtn=document.getElementById('rvCloseBtn');
  if(closeBtn)closeBtn.onclick=function(){closeRvSheet();};
  var saveBtn=document.getElementById('rvSaveBtn');

  var delBtn=document.getElementById('rvDelBtn');

  var amtArea=document.getElementById('rvAmtDisp');

  if(amtHint)amtHint.onclick=function(){openRvKp();};
  var skipBtn=document.getElementById('rvSkipBtn');
  if(skipBtn)skipBtn.onclick=function(){S.rv.costSkipped=!S.rv.costSkipped;if(S.rv.costSkipped){S.rv.amount='0';}else{S.rv.amount='';}rvRefresh();};
  document.querySelectorAll('[data-rvtype]').forEach(function(btn){
    btn.onclick=function(){S.rv.resType=btn.dataset.rvtype;rvRefresh();};
  });
  document.querySelectorAll('[data-rvfam]').forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var fk=btn.dataset.rvfam;
      S.rv.ddOpen=S.rv.ddOpen===fk?null:fk;
      rvRefresh();
    };
  });
  document.querySelectorAll('[data-rvddall]').forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var fk=btn.dataset.rvddall;
      var allSel=rvAllSelected(fk);
      rvFamMembers(fk).forEach(function(m){S.rv.memSel[m.id]=!allSel;});
      rvRefresh();
    };
  });
  document.querySelectorAll('[data-rvmem]').forEach(function(item){
    item.onclick=function(e){
      e.stopPropagation();
      var mid=item.dataset.rvmem;
      S.rv.memSel[mid]=!S.rv.memSel[mid];
      rvRefresh();
    };
  });
  document.querySelectorAll('[data-rvcur]').forEach(function(btn){
    btn.onclick=function(){S.rv.currency=btn.dataset.rvcur;rvRefresh();};
  });
  document.querySelectorAll('[data-rvpb]').forEach(function(btn){
    btn.onclick=function(){S.rv.paidBy=S.rv.paidBy===btn.dataset.rvpb?null:btn.dataset.rvpb;rvRefresh();};
  });
  function _wrvdt(){var v=rvGetDt('rvDateInp','rvTimeInp',S.rv.dt);if(v){S.rv.dt=v;S.rv.savedDt=v;}}
  function _wrvedt(){S.rv.endDt=rvGetDt('rvEndDateInp','rvEndTimeInp',S.rv.endDt);}
  ['rvDateInp','rvTimeInp'].forEach(function(id){var el=document.getElementById(id);if(el)el.onchange=_wrvdt;});
  ['rvEndDateInp','rvEndTimeInp'].forEach(function(id){var el=document.getElementById(id);if(el)el.onchange=_wrvedt;});
}

function openRvKp(){
  S.rv.kpDigits=S.rv.amount!==''?S.rv.amount:'0';
  S.rv.kpReplacing=(S.rv.amount!=='');  // pre-filled value: first key replaces
  var kpSheet=document.getElementById('rvKpSheet');
  var kpOvr=document.getElementById('rvKpOverlay');
  kpSheet.innerHTML=rvKpHTML();
  kpSheet.classList.add('open');
  kpOvr.classList.add('open');
  bindRvKp();
}

function bindRvKp(){
  document.querySelectorAll('[data-rvkey]').forEach(function(btn){
    btn.onclick=function(){
      var k=btn.dataset.rvkey;
      // first key after opening with a pre-filled value replaces it entirely
      if(S.rv.kpReplacing){
        S.rv.kpReplacing=false;
        if(k==='DEL'){S.rv.kpDigits='0';}
        else{S.rv.kpDigits=(k==='.'?'0.':k);}
        S.rv.kpDigits=S.rv.kpDigits;
        var kpSheet2=document.getElementById('rvKpSheet');
        if(kpSheet2&&kpSheet2.classList.contains('open')){kpSheet2.innerHTML=rvKpHTML();bindRvKp();}
        return;
      }
      var d=S.rv.kpDigits!=null?S.rv.kpDigits:'0';
      if(k==='DEL'){d=d.length>1?d.slice(0,-1):'0';}
      else if(k==='.'&&d.indexOf('.')>=0){}
      else{if(d==='0'&&k!=='.')d='';d+=k;}
      S.rv.kpDigits=d;
      var kpSheet=document.getElementById('rvKpSheet');
      if(kpSheet&&kpSheet.classList.contains('open')){kpSheet.innerHTML=rvKpHTML();bindRvKp();}
    };
  });
  var saveBtn=document.getElementById('rvKpSave');
  if(saveBtn)saveBtn.onclick=function(){
    S.rv.amount=S.rv.kpDigits;
    S.rv.costSkipped=false;
    closeRvKp();
    rvRefresh();
  };
  var kpOvr=document.getElementById('rvKpOverlay');
  if(kpOvr)kpOvr.onclick=function(e){
    if(e.target===kpOvr){S.rv.amount=S.rv.kpDigits;closeRvKp();}
  };
}

function closeRvKp(){
  document.getElementById('rvKpSheet').classList.remove('open');
  document.getElementById('rvKpOverlay').classList.remove('open');
}

function closeRvSheet(){
  var sv=rvGetDt('rvDateInp','rvTimeInp',S.rv.dt);
  if(sv)S.rv.savedDt=sv;
  document.getElementById('rvSheet').classList.remove('open');
  document.getElementById('rvOverlay').classList.remove('open');
  closeRvKp();
}

function submitReservation(){
  var nameEl=document.getElementById('rvName');
  var locEl=document.getElementById('rvLoc');
  var notesEl=document.getElementById('rvNotes');
  var name=nameEl?nameEl.value.trim():'';
  if(!name){alert('Name is required.');return;}
  var loc=locEl?locEl.value.trim():'';
  var notes=notesEl?notesEl.value.trim():'';
  var dt=rvGetDt('rvDateInp','rvTimeInp',S.rv.dt);
  if(dt)S.rv.savedDt=dt;
  var endDt=rvGetDt('rvEndDateInp','rvEndTimeInp',S.rv.endDt);
  var amt=S.rv.amount!==''&&S.rv.amount!=null?parseFloat(S.rv.amount):null;
  sdot('saving');
  var row={
    name:name,res_type:S.rv.resType,
    reservation_dt:dt?new Date(dt).toISOString():null,
    end_dt:endDt?new Date(endDt).toISOString():null,
    location:loc||null,notes:notes||null,
    amount:amt!=null?amt:null,
    currency:amt!=null?S.rv.currency:null,
    paid_by_family:amt!=null&&S.rv.paidBy?S.rv.paidBy:null,
    cost_skipped:S.rv.costSkipped||false,
    trip_id:S.trip&&S.trip.id||null,
    entered_by:S.user&&S.user.id||null
  };
  var isNew=!S.rv.editId;
  var p=isNew?sb.from('reservations').insert(row).select():sb.from('reservations').update(row).eq('id',S.rv.editId);
  p.then(function(r){
    if(r.error){sdot('err');console.error(r.error);return;}
    var rid=isNew?(r.data&&r.data[0]&&r.data[0].id):S.rv.editId;
    sb.from('reservation_guests').delete().eq('reservation_id',rid).then(function(){
      var gRows=Object.keys(S.rv.memSel).filter(function(mid){return S.rv.memSel[mid];}).map(function(mid){return{reservation_id:rid,member_id:mid,is_companion:false};});
      var gp=gRows.length?sb.from('reservation_guests').insert(gRows):Promise.resolve({});
      gp.then(function(){
        if(amt!=null&&amt>0&&S.rv.paidBy&&S.trip){
          var amtUSD=S.rv.currency==='EUR'?amt*(S.exRate||1.09):amt;
          var fkeys=['jmcr','matthews','silvermans'];
          var famCounts={jmcr:0,matthews:0,silvermans:0};
          Object.keys(S.rv.memSel).filter(function(mid){return S.rv.memSel[mid];}).forEach(function(mid){
            var m=S.allMembers.find(function(x){return x.id===mid;});
            if(m){fkeys.forEach(function(fk){if(m.family_id===FIDS[fk])famCounts[fk]++;});}
          });
          var expRow={trip_id:S.trip.id,description:name,category:'Activity',amount:amt,amount_usd:parseFloat(amtUSD.toFixed(2)),currency:S.rv.currency,paid_by_family:S.rv.paidBy,created_at:dt?new Date(dt).toISOString():new Date().toISOString(),reservation_id:rid};
          var existingExp=S.expenses.find(function(e){return e.reservation_id===rid;});
          var ep=existingExp?sb.from('expenses').update(expRow).eq('id',existingExp.id).select():sb.from('expenses').insert(expRow).select();
          ep.then(function(re){
            if(re.error){sdot('err');console.error(re.error);}
            var eid=existingExp?existingExp.id:(re.data&&re.data[0]&&re.data[0].id);
            if(eid){
              sb.from('expense_splits').delete().eq('expense_id',eid).then(function(){
                var splits=[];fkeys.forEach(function(fk){if(famCounts[fk]>0)splits.push({expense_id:eid,family_key:fk,people_count:famCounts[fk]});});
                var sp=splits.length?sb.from('expense_splits').insert(splits):Promise.resolve({});
                sp.then(function(){loadExpenses(function(exps){S.expenses=exps;});});
              });
            }
          });
        }
        sb.from('reservations').select('*,reservation_guests(*,members(name,icon,icon_color))').order('reservation_dt').then(function(r2){S.reserves=r2.data||[];sdot('');closeRvSheet();renderPanel();});
      });
    });
  });
}
document.addEventListener('click',function(e){
  if(!e.target.closest('#ctx')&&!e.target.closest('.idot'))
    document.getElementById('ctx').classList.remove('open');
  if(!e.target.closest('.ddwrap')){
    var dd=document.getElementById('packDD');
    if(dd)dd.classList.remove('open');
  }
  var psBtn=e.target.closest('#packSelBtn');
  if(psBtn&&!e.target.closest('#addPackBtn')){
    var dd2=document.getElementById('packDD');
    if(dd2)dd2.classList.toggle('open');
    return;
  }
  var rItem=e.target.closest('[data-rysub]');
  if(rItem){
    S.sel={type:'ryan',sub:rItem.dataset.rysub};
    var dd3=document.getElementById('packDD');if(dd3)dd3.classList.remove('open');
    saveAS();renderPanel();return;
  }
  var mItem=e.target.closest('#packDD [data-mid]');
  if(mItem){
    var m=S.members.find(function(x){return x.id===mItem.dataset.mid;})||null;
    S.sel={type:'member',member:m};
    var dd4=document.getElementById('packDD');if(dd4)dd4.classList.remove('open');
    saveAS();renderPanel();return;
  }
  var pkRow=e.target.closest('.pkrow[data-pkid]');

    var pk=S.members.filter(function(m){return!m.is_subject;});
    S.user=pk.find(function(m){return m.id===pkRow.dataset.pkid;})||S.user;
    closeBS();renderToolbar();return;
  }
  if(e.target.closest('#addPackBtn')){
    if(S.sel&&S.sel.type==='ryan')openAddItem('ryan');
    else openAddItem('family');return;
  }
  if(e.target.closest('#splitAddBtn')){openKP();return;}
  if(e.target.closest('#addFlightBtn')){openAddFlight();return;}
  if(e.target.closest('#addHotelBtn')){openAddHotel(null);return;}
  if(e.target.closest('#addReserveBtn')){openAddReservation(null);return;}
  var rcost=e.target.closest('[data-rcost]');

    var rid=rcost.dataset.rcost;
    var rv=S.reserves.find(function(x){return x.id===rid;});
    if(rv)openAddReservation(rv);
    return;
  }
  var fc=e.target.closest('[data-fid]');if(fc){flightDetail(fc.dataset.fid);return;}
  var hc=e.target.closest('[data-hid]');if(hc){hotelDetail(hc.dataset.hid);return;}
  var rc=e.target.closest('[data-rid]');if(rc&&!e.target.closest('[data-rcost]')){reserveDetail(rc.dataset.rid);return;}
  if(e.target.closest('#rvOverlay')&&!e.target.closest('#rvSheet'))closeRvSheet();
  if(e.target.closest('#bsovr')&&!e.target.closest('#bsheet'))closeBS();
});

function toggleCheck(id){
  sdot('saving');
  var item=S.items.find(function(i){return i.id===id;});if(!item)return;
  var nd=!item.is_done;
  var uid=S.user&&S.user.id||null;
  sb.from('checklist_items').update({is_done:nd,done_by:nd?uid:null,done_at:nd?new Date().toISOString():null,is_skipped:false}).eq('id',id)
  .then(function(r){if(r.error){sdot('err');return;}item.is_done=nd;item.done_by=nd?uid:null;item.is_skipped=false;sdot('');renderPanel();updateProg();});
}
function undoCheck(id){
  sdot('saving');
  sb.from('checklist_items').update({is_done:false,done_by:null,done_at:null}).eq('id',id)
  .then(function(r){if(r.error){sdot('err');return;}var item=S.items.find(function(i){return i.id===id;});if(item){item.is_done=false;item.done_by=null;}sdot('');renderPanel();updateProg();});
}
function skipItem(id){
  sdot('saving');
  var item=S.items.find(function(i){return i.id===id;});if(!item)return;
  var ns=!item.is_skipped;
  sb.from('checklist_items').update({is_skipped:ns,is_done:false,done_by:null,done_at:null}).eq('id',id)
  .then(function(r){if(r.error){sdot('err');return;}item.is_skipped=ns;item.is_done=false;sdot('');closeCtx();renderPanel();updateProg();});
}
function deleteItem(id){
  sdot('saving');
  sb.from('checklist_items').delete().eq('id',id)
  .then(function(r){if(r.error){sdot('err');return;}S.items=S.items.filter(function(i){return i.id!==id;});sdot('');closeCtx();renderPanel();updateProg();});
}
function itemCtx(e,id){

  ctx.innerHTML='<button class="cxi" onclick="skipItem(\''+id+'\')">'+(item.is_skipped?'Unskip':'Skip')+'</button>'

    +'<div class="cxd"></div>'

  ctx.style.top=Math.min(e.clientY+4,window.innerHeight-130)+'px';

  ctx.classList.add('open');

function openAddItem(tab){
  var isFam=tab==='family';
  var pk=S.members.filter(function(m){return!m.is_subject;});
  var body='';
  if(isFam){
    var tiles='';var selMem=S.sel&&S.sel.type==='member'?S.sel.member:null;

function saveMemberEdit(id){
  var inp=document.getElementById('mgrei_'+id);if(!inp)return;
  var val=inp.value.trim();if(!val){alert('Name cannot be empty.');return;}
  sdot('saving');
  sb.from('members').update({name:val}).eq('id',id)
  .then(function(r){
    if(r.error){sdot('err');alert('Could not save: '+r.error.message);return;}
    var m=S.members.find(function(x){return x.id===id;});if(m)m.name=val;
    var am=S.allMembers.find(function(x){return x.id===id;});if(am)am.name=val;
    resolveJJMembers();
    sdot('');openMemberMgr();renderToolbar();renderPanel();
  });

function deleteMember(id){
  var m=S.members.find(function(x){return x.id===id;});if(!m)return;
  if(!confirm('Remove '+m.name+'?'))return;sdot('saving');
  sb.from('members').delete().eq('id',id)
  .then(function(r){
    if(r.error){sdot('err');alert('Could not remove: '+r.error.message);return;}
    S.members=S.members.filter(function(x){return x.id!==id;});
    S.allMembers=S.allMembers.filter(function(x){return x.id!==id;});
    resolveJJMembers();
    if(S.sel&&S.sel.type==='member'&&S.sel.member&&S.sel.member.id===id){
      var pk2=S.members.filter(function(m){return!m.is_subject;});
      S.sel=pk2.length?{type:'member',member:pk2[0]}:(S.isJMCR?{type:'ryan',sub:'Backpack'}:null);
    }
    if(S.user&&S.user.id===id){var pk3=S.members.filter(function(m){return!m.is_subject;});S.user=pk3[0]||null;}
    sdot('');openMemberMgr();renderToolbar();renderPanel();
  });
}

function submitFlight(editId){
  var from=V('fFrom'),to=V('fTo'),dep=V('fDep');
  if(!from||!to||!dep){alert('From, To and Departure required.');return;}sdot('saving');
  var insEl=document.querySelector('#insTog .fl-on');var isIns=insEl&&insEl.textContent.trim().startsWith('Yes');
  var row={trip_id:S.trip&&S.trip.id||null,origin_city:from,dest_city:to,departure_dt:new Date(dep).toISOString(),arrival_dt:V('fArr')?new Date(V('fArr')).toISOString():null,airline:V('fAl')||null,flight_number:V('fNum')||null,gate:V('fGate')||null,confirmation_no:V('fConf')||null,is_insured:isIns,insurance_policy_no:isIns?(V('fPol')||null):null,notes:V('fNotes')||null,entered_by:S.user&&S.user.id||null};
  var isNew=!editId||editId==='null';
  var p=isNew?sb.from('flights').insert(row).select().single():sb.from('flights').update(row).eq('id',editId);
  p.then(function(rd){

    var fid=isNew?rd.data.id:editId;
    sb.from('flight_passengers').delete().eq('flight_id',fid).then(function(){
      var paxRows=[];

      S.companions.forEach(function(c){paxRows.push({flight_id:fid,companion_name:c.name,seat:c.seat||null,is_companion:true});});
      var ip=paxRows.length?sb.from('flight_passengers').insert(paxRows):Promise.resolve({});
      ip.then(function(){S.companions=[];sb.from('flights').select('*,flight_passengers(*,members(name,icon,icon_color))').order('departure_dt').then(function(r){S.flights=r.data||[];sdot('');closeAll();renderPanel();});});
    });
  });
}

function famMemCount(fk){

function calcSplits(){var total=parseFloat(S.kp.amount)||0;if(S.kp.currency==='EUR')total=total*(S.exRate||1.09);var jn=S.kp.jmcrN||0,mn=S.kp.mattN||0,sn=S.kp.silvN||0,jjn=S.kp.jjN||0;var tot=jn+mn+sn+jjn;var pp=tot>0?total/tot:0;return{jmcr:jn,matt:mn,silv:sn,jj:jjn,total:tot,pp:pp,jAmt:pp*jn,mAmt:pp*(mn+jjn),sAmt:pp*sn,jjAmt:pp*jjn,usdTotal:total};}

function loadExpenses(cb){
  if(!S.trip){cb([]);return;}
  sb.from('expenses').select('*').eq('trip_id',S.trip.id)
  .order('created_at',{ascending:false})
  .then(function(re){
    var exps=re.data||[];
    if(!exps.length){cb([]);return;}
    var ids=exps.map(function(e){return e.id;});
    sb.from('expense_splits').select('*').in('expense_id',ids)
    .then(function(rs){
      var splits=rs.data||[];
      exps.forEach(function(e){
        e.expense_splits=splits.filter(function(s){return s.expense_id===e.id;});
      });
      cb(exps);
    }).catch(function(){
      exps.forEach(function(e){e.expense_splits=[];});
      cb(exps);
    });
  });
}
function splitPanel(){
  var exps=(S.expenses||[]).slice().sort(function(a,b){
    if(S.sortBy==='paidby')return(a.paid_by_family||'').localeCompare(b.paid_by_family||'');
    return new Date(b.created_at)-new Date(a.created_at);
  });
  var uf=function(n){return'$'+n.toFixed(2);};
  var tot=0;exps.forEach(function(e){tot+=parseFloat(e.amount_usd||e.amount||0);});

  // Inter-family balances: J&J share rolls up into Matthews
  var bal={jmcr:0,matthews:0,silvermans:0};
  var paid={jmcr:0,matthews:0,silvermans:0};
  var jjTotal=0; // cumulative J&J sub-ledger across all expenses

  exps.forEach(function(e){
    var au=parseFloat(e.amount_usd||e.amount||0);
    if(paid[e.paid_by_family]!==undefined)paid[e.paid_by_family]+=au;
    var spl=e.expense_splits||[];
    var tp=spl.reduce(function(s,x){return s+(x.people_count||0);},0);
    if(!tp)return;
    var pp=au/tp;
    // Accumulate J&J sub-ledger
    var jjRow=spl.find(function(x){return x.family_key==='jj';});
    if(jjRow)jjTotal+=pp*(jjRow.people_count||0);
    spl.forEach(function(x){
      // Treat 'jj' as part of Matthews for inter-family settlement
      var fk=x.family_key==='jj'?'matthews':x.family_key;
      if(fk===e.paid_by_family)return;
      if(bal[fk]!==undefined)bal[fk]-=pp*(x.people_count||0);
      if(bal[e.paid_by_family]!==undefined)bal[e.paid_by_family]+=pp*(x.people_count||0);
    });

    +'<div class="sstat"><div class="sstat-lbl">Expenses</div><div class="sstat-val">'+exps.length+'</div></div>'

    +'</div>'
    +'</div>'
    +'<div class="net-banner">'
    +['jmcr','matthews','silvermans'].map(function(fk){
      var b=bal[fk]||0;
      var cls=b>0.01?'pos':b<-0.01?'neg':'zer';
      var paidAmt=paid[fk]||0;
      var netLbl=b>0.01?'(owed +'+uf(b)+')':b<-0.01?'(owes '+uf(-b)+')':'(settled)';
      return'<div class="net-card '+cls+'">'
        +'<div class="net-name">'+famName(fk)+'</div>'

  if(S.splitView==='expenses'){

      var au=parseFloat(e.amount_usd||e.amount||0);
      var pp=tp>0?au/tp:0;
      var catMap={Food:'#FFCCBC:#8B1A00',Activity:'#BBDEFB:#003070',Transport:'#FFF59D:#7A4F00',Lodging:'#B2EBF2:#006064'};

      // Build per-family split display; J&J sub-line shown beneath Matthews

          +' ('+(x.people_count||0)+'p\u00b7'+uf(pp*(x.people_count||0))+')');
      });

    html+='</div>';
  }else{
    // SUMMARY VIEW
    var fks=['jmcr','matthews','silvermans'];
    html+='<div class="net-banner">';
