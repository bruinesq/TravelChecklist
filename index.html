<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel">
<title>Family Travel</title>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f0eb;overscroll-behavior:none}
.fscreen{position:fixed;inset:0;background:linear-gradient(160deg,#1a6b8a,#0d4f6b,#0a3d54);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000;padding:2rem}
.fscreen.hide{display:none}
.fscreen-title{font-size:1.4rem;font-weight:700;color:white;margin-bottom:.3rem}
.fscreen-sub{font-size:.75rem;color:rgba(255,255,255,.65);margin-bottom:2rem}
.fscreen-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;max-width:22rem}
.ftile{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.5rem 1rem;border-radius:1rem;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);cursor:pointer}
.ftile:active{background:rgba(255,255,255,.3)}
.ftile-ico{font-size:2rem}
.ftile-name{font-size:.95rem;font-weight:700;color:white}
.ftile-sub{font-size:.6rem;color:rgba(255,255,255,.65);text-align:center;line-height:1.4}
.lscreen{position:fixed;inset:0;background:linear-gradient(160deg,#1a6b8a,#0a3d54);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8000}
.lscreen.hide{display:none}
.lscreen-ico{font-size:3rem;margin-bottom:1rem}
.lscreen-txt{font-size:.9rem;color:rgba(255,255,255,.8);font-weight:500}
#app{display:none}
.hero{background:#87CEEB;padding:.75rem .9rem 4.2rem;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1.6rem;background:#f2f0eb;clip-path:ellipse(55% 100% at 50% 100%)}
.hero-sun{position:absolute;top:.5rem;right:.5rem;width:2rem;height:2rem;border-radius:50%;background:radial-gradient(circle,#FFE566 40%,#FFD700 70%,transparent 100%);pointer-events:none;z-index:0}
.hero-row{display:flex;align-items:center;gap:.5rem;position:relative;z-index:1}
.hero-emoji{font-size:2.6rem;line-height:1;flex-shrink:0}
.hero-txt{flex:1}
.hero-badge{display:inline-flex;align-items:center;gap:.3rem;background:rgba(0,43,92,.18);border-radius:99px;padding:.15rem .5rem;font-size:.58rem;font-weight:600;color:#002B5C;cursor:pointer;margin-bottom:.15rem;border:none;-webkit-appearance:none}
.hero-title{font-size:.95rem;font-weight:700;color:#002B5C}
.hero-sub{font-size:.58rem;color:#003A7A;margin-top:.1rem}
.prog-row{display:flex;align-items:center;gap:.5rem;margin-top:.55rem;position:relative;z-index:1}
.pw{flex:1;background:rgba(0,43,92,.15);border-radius:99px;height:.4rem}
.pb{background:#FFD700;border-radius:99px;height:.4rem;transition:width .4s}
.pl{font-size:.55rem;color:#002B5C;font-weight:600;margin-top:.2rem}
.newtrip-btn{display:flex;align-items:center;gap:.2rem;padding:.28rem .55rem;border-radius:.5rem;border:1.5px solid rgba(0,43,92,.35);background:rgba(255,255,255,.45);font-size:.58rem;color:#002B5C;cursor:pointer;flex-shrink:0;font-weight:600}
.sdot{width:.45rem;height:.45rem;border-radius:50%;background:rgba(0,43,92,.28);display:inline-block;margin-left:.3rem;transition:background .3s;flex-shrink:0}
.sdot.saving{background:#FFD700}.sdot.err{background:#E53935}
.hero-beach{position:absolute;bottom:.6rem;left:0;right:0;width:100%;height:2.8rem;pointer-events:none}
.toolbar{background:white;padding:.45rem .7rem;border-bottom:1px solid #e4e0d8;display:flex;align-items:center;gap:.3rem;overflow-x:auto}
.ulbl{font-size:.58rem;color:#999;white-space:nowrap;flex-shrink:0}
.ubtn{display:flex;align-items:center;gap:.22rem;padding:.3rem .55rem;border-radius:99px;border:1.5px solid transparent;font-size:.62rem;cursor:pointer;background:transparent;flex-shrink:0;white-space:nowrap}
.ubtn.active{font-weight:600}
.udot{width:.4rem;height:.4rem;border-radius:50%;flex-shrink:0}
.pencilbtn{background:none;border:none;cursor:pointer;font-size:.95rem;color:#bbb;padding:.2rem}
.nav{display:flex;border-bottom:2px solid #ddd8cc;background:#f2f0eb}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.5rem .2rem .55rem;border:none;cursor:pointer;background:transparent;border-top:3px solid transparent;border-right:1px solid #e0d8c8}
.ntab:last-child{border-right:none}
.ntab.active{background:white}
.ntab.active.t-ryan{border-top-color:#7F77DD}
.ntab.active.t-family{border-top-color:#1D9E75}
.ntab.active.t-flight{border-top-color:#378ADD}
.ntab.active.t-hotel{border-top-color:#D85A30}
.ntab.active.t-reserve{border-top-color:#9B59B6}
.ntab-ico{font-size:1.1rem;line-height:1}
.ntab-lbl{font-size:.5rem;font-weight:600;color:#777;white-space:nowrap}
.ntab.active .ntab-lbl{color:#222}
.ntab-cnt{font-size:.44rem;padding:.04rem .28rem;border-radius:99px;background:#e0d8c8;color:#555}
.ntab.active.t-ryan .ntab-cnt{background:#CECBF6;color:#3C3489}
.ntab.active.t-family .ntab-cnt{background:#9FE1CB;color:#085041}
.ntab.active.t-flight .ntab-cnt{background:#B5D4F4;color:#0C447C}
.ntab.active.t-hotel .ntab-cnt{background:#F5C4B3;color:#712B13}
.ntab.active.t-reserve .ntab-cnt{background:#E8C8F8;color:#6B2F9E}
.ddwrap{position:relative;width:100%}
.ddsel{width:100%;background:white;border:none;border-bottom:2px solid #e0d8c8;padding:.55rem .85rem;font-size:.82rem;font-weight:600;color:#111;display:flex;align-items:center;gap:.5rem;cursor:pointer;text-align:left;-webkit-appearance:none;appearance:none}
.ddsel:active{background:#f5f5f5}
.ddsel-lbl{flex:1;text-align:left}
.ddsel-cnt{font-size:.58rem;padding:.08rem .38rem;border-radius:99px;background:#CECBF6;color:#3C3489}
.ddsel-cnt.fam{background:#9FE1CB;color:#085041}
.ddarrow{font-size:.75rem;color:#aaa;transition:transform .18s;pointer-events:none}
.ddarrow.open{transform:rotate(180deg)}
.ddmenu{position:absolute;top:100%;left:0;right:0;background:white;border:1px solid #e0d8c8;border-top:none;border-radius:0 0 .6rem .6rem;z-index:400;box-shadow:0 6px 20px rgba(0,0,0,.12);display:none;overflow:hidden}
.ddmenu.open{display:block}
.dditem{display:flex;align-items:center;gap:.5rem;padding:.7rem .85rem;cursor:pointer;font-size:.78rem;color:#111;border-bottom:.5px solid #f0ede6}
.dditem:last-child{border-bottom:none}
.dditem:active,.dditem:hover{background:#f5f0e8}
.dditem.sel{background:#EEEDFE;color:#3C3489;font-weight:600}
.dditem.selfam{background:#E1F5EE;color:#085041;font-weight:600}
.dditem-ico{font-size:1rem;flex-shrink:0}
.dditem-cnt{margin-left:auto;font-size:.55rem;padding:.06rem .35rem;border-radius:99px;background:#e8e4dc;color:#555}
.addbar{display:flex;align-items:center;padding:.4rem .85rem;border-bottom:1px solid rgba(0,0,0,.08)}
.ph-add{display:flex;align-items:center;gap:.2rem;padding:.28rem .6rem;border-radius:.5rem;border:none;font-size:.62rem;font-weight:600;cursor:pointer;color:white;margin-left:auto}
.ilist{list-style:none}
.irow{display:flex;align-items:center;gap:.38rem;padding:.65rem .85rem;border-bottom:.5px solid rgba(0,0,0,.06);min-height:2.6rem;background:white}
.irow:last-child{border-bottom:none}
.irow.done{opacity:.48}
.irow.skip{background:repeating-linear-gradient(90deg,transparent,transparent 8px,rgba(0,0,0,.02) 8px,rgba(0,0,0,.02) 9px)}
.ichk{width:1.3rem;height:1.3rem;border-radius:50%;border:1.5px solid #b0c8b0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0;color:transparent}
.ichk.on{background:#1D9E75;border-color:#1D9E75;color:white}
.itxt{flex:1;font-size:.76rem;color:#111;min-width:0;line-height:1.35}
.itxt.struck{text-decoration:line-through;color:#bbb}
.itxt.skp{font-style:italic;color:#b0a070}
.iundo{font-size:.56rem;color:#1D9E75;cursor:pointer;text-decoration:underline;margin-top:.1rem;display:block;border:none;background:none;padding:0}
.istamp{font-size:.5rem;padding:.08rem .38rem;border-radius:99px;font-weight:600;flex-shrink:0}
.iskip{font-size:.48rem;padding:.08rem .35rem;border-radius:.25rem;background:rgba(0,0,0,.07);color:#8a7040;font-style:italic;border:1px dashed #c0a868;flex-shrink:0}
.idot{background:none;border:none;cursor:pointer;font-size:.9rem;color:#c0a878;padding:.1rem .15rem;flex-shrink:0;min-width:1.6rem;min-height:1.6rem;display:flex;align-items:center;justify-content:center}
.empty{padding:2rem 1.5rem;text-align:center;color:#aaa;font-size:.75rem;background:white}
.cards{display:flex;flex-direction:column}
.card{background:white;border-bottom:1px solid #ece8e0;padding:.8rem;cursor:pointer;position:relative}
.card:active{background:#faf8f4}
.card.past{opacity:.5}
.card-title{font-size:.82rem;font-weight:600;color:#111;margin-bottom:.18rem}
.card-sub{font-size:.62rem;color:#666;line-height:1.4}
.card-chev{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);font-size:.8rem;color:#ccc}
.pill{display:inline-block;font-size:.5rem;font-weight:600;padding:.08rem .35rem;border-radius:99px;margin-right:.2rem}
.pill.fl{background:#B5D4F4;color:#0C447C}
.pill.ht{background:#F5C4B3;color:#712B13}
.pill.rs{background:#E8C8F8;color:#6B2F9E}
.pill.pt{background:#f0e8d0;color:#8a6020}
.secsep{padding:.35rem .85rem;background:#f2f0eb;font-size:.52rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.05em}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500}
.overlay.open{display:block}
.cpanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:1rem;width:min(92vw,26rem);max-height:82vh;overflow-y:auto;z-index:600;display:none;box-shadow:0 8px 40px rgba(0,0,0,.22)}
.cpanel.open{display:block}
.cp-head{display:flex;align-items:center;gap:.5rem;padding:.9rem 1rem .7rem;border-bottom:1px solid #ece8e0;position:sticky;top:0;background:white;z-index:1}
.cp-title{font-size:.88rem;font-weight:600;flex:1;color:#111}
.cp-close{background:none;border:none;font-size:1.2rem;color:#aaa;cursor:pointer}
.cp-body{padding:.8rem 1rem 1.2rem}
.fsec{margin-bottom:.9rem}
.flbl{font-size:.58rem;font-weight:700;color:#888;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.25rem;display:block}
.finp{width:100%;border:1.5px solid #e0d8c8;border-radius:.5rem;padding:.5rem .6rem;font-size:.82rem;background:#faf9f6;-webkit-appearance:none;outline:none;font-family:inherit;color:#111}
.finp:focus{border-color:#378ADD;background:white}
.fta{resize:none;min-height:3rem;line-height:1.4}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.ftog{display:flex;border:1.5px solid #e0d8c8;border-radius:.5rem;overflow:hidden}
.ftog-opt{flex:1;padding:.45rem .25rem;border:none;font-size:.68rem;font-weight:500;cursor:pointer;background:white;color:#666;text-align:center}
.ftog-opt.on{background:#378ADD;color:white;font-weight:600}
.mtiles{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.15rem}
.mtile{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.4rem .5rem;border-radius:.55rem;border:1.5px solid #e0d8c8;background:white;cursor:pointer;min-width:2.6rem}
.mtile.sel{border-color:#1D9E75;background:#E1F5EE}
.fam-group{margin-bottom:.65rem}
.fam-group-lbl{font-size:.55rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;padding:.18rem .45rem;background:#f2f0eb;border-radius:.3rem;display:block;margin-bottom:.3rem}
.comp-row{display:flex;gap:.35rem;align-items:center;margin-bottom:.35rem}
.comp-add{background:#E6F1FB;border:none;border-radius:.5rem;padding:.45rem .55rem;font-size:.8rem;cursor:pointer;color:#0C447C;flex-shrink:0}
.comp-list{margin-top:.25rem}
.comp-item{display:flex;align-items:center;gap:.35rem;padding:.28rem 0;font-size:.68rem;color:#333;border-bottom:.5px solid #f0ede6}
.comp-del{background:none;border:none;font-size:.8rem;color:#E53935;cursor:pointer}
.sbtn{width:100%;padding:.7rem;border:none;border-radius:.6rem;font-size:.88rem;font-weight:600;cursor:pointer;margin-top:.7rem;color:white}
.sbtn.ryan{background:#7F77DD}.sbtn.family{background:#1D9E75}
.sbtn.flight{background:#378ADD}.sbtn.hotel{background:#D85A30}
.sbtn.reserve{background:#9B59B6}
.dbtn{width:100%;padding:.58rem;border:1.5px solid #E53935;border-radius:.6rem;font-size:.76rem;cursor:pointer;margin-top:.45rem;background:white;color:#E53935}
.drow{display:flex;gap:.45rem;padding:.5rem 0;border-bottom:.5px solid #f0ede6;align-items:flex-start}
.drow:last-child{border-bottom:none}
.dlbl{font-size:.56rem;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.04em;width:5rem;flex-shrink:0;padding-top:.05rem}
.dval{font-size:.75rem;color:#111;flex:1;line-height:1.4}
.ctx{display:none;position:fixed;background:white;border:1px solid #e0d0b0;border-radius:.6rem;z-index:700;min-width:9.5rem;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.13)}
.ctx.open{display:block}
.cxi{padding:.65rem .82rem;font-size:.72rem;cursor:pointer;display:flex;align-items:center;gap:.45rem;color:#111;border:none;background:none;width:100%;text-align:left}
.cxi:active{background:#f5f0e8}.cxi.red{color:#E53935}
.cxd{height:.5px;background:#ece8e0}
.covr{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:750}
.covr.open{display:block}
.cmod{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:1rem;width:min(88vw,22rem);padding:1.3rem 1.1rem;z-index:760;display:none;box-shadow:0 8px 40px rgba(0,0,0,.22)}
.cmod.open{display:block}
.cmod-t{font-size:.88rem;font-weight:600;color:#111;margin-bottom:.45rem}
.cmod-m{font-size:.7rem;color:#666;line-height:1.55;margin-bottom:.9rem}
.cmod-btns{display:flex;gap:.45rem}
.cmod-cancel{flex:1;padding:.62rem;border:1.5px solid #e0d0b0;border-radius:.6rem;background:none;font-size:.75rem;cursor:pointer;color:#666}
.cmod-ok{flex:1;padding:.62rem;border:none;border-radius:.6rem;background:#E53935;color:white;font-size:.75rem;font-weight:600;cursor:pointer}

</style>
</head>
<body>

<div class="fscreen" id="fscreen">
  <div style="font-size:3rem;margin-bottom:1rem">&#x2708;&#xFE0F;&#x1F30A;</div>
  <div class="fscreen-title">Family Travel</div>
  <div class="fscreen-sub">Select your family to continue</div>
  <div class="fscreen-grid">
    <div class="ftile" onclick="pickFamily('jmcr')">
      <span class="ftile-ico">&#x1F3D6;&#xFE0F;</span>
      <span class="ftile-name">JMCR</span>
      <span class="ftile-sub">Jon &middot; Mary &middot; Cordy &middot; Mav<br>+ Ryan</span>
    </div>
    <div class="ftile" onclick="pickFamily('matthews')">
      <span class="ftile-ico">&#x1F6A2;</span>
      <span class="ftile-name">Matthews</span>
      <span class="ftile-sub">Dad &middot; Mom &middot; Reagan<br>Lincoln &middot; Nixon</span>
    </div>
    <div class="ftile" onclick="pickFamily('silvermans')">
      <span class="ftile-ico">&#x2B50;</span>
      <span class="ftile-name">Silvermans</span>
      <span class="ftile-sub">Josh &middot; Lori<br>Mikayla &middot; Zach</span>
    </div>
  </div>
</div>

<div class="lscreen hide" id="lscreen">
  <div class="lscreen-ico">&#x2708;&#xFE0F;</div>
  <div class="lscreen-txt">Loading your trip...</div>
</div>

<div id="app">
  <div class="hero">
    <div class="hero-sun"></div>
    <div class="hero-row">
      <span class="hero-emoji">&#x2708;&#xFE0F;</span>
      <div class="hero-txt">
        <button class="hero-badge" onclick="switchFam()"><i class="ti ti-refresh"></i><span id="hBadge">Family</span></button>
        <div class="hero-title">Family Vacation Checklist &#x1F30A;</div>
        <div class="hero-sub">Pack smart &mdash; adventure awaits!</div>
      </div>
      <span class="sdot" id="sdot"></span>
    </div>
    <div class="prog-row">
      <div style="flex:1">
        <div class="pw"><div class="pb" id="pb" style="width:0%"></div></div>
        <div class="pl" id="pl"></div>
      </div>
      <button class="newtrip-btn" onclick="openNewTrip()">&#x21BA; New trip</button>
    </div>
    <svg class="hero-beach" viewBox="0 0 400 45" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
<rect width="400" height="45" fill="#87CEEB"/>
<rect x="0" y="22" width="400" height="23" fill="#1565C0"/>
<path d="M0 22 Q20 18 40 22 Q60 26 80 22 Q100 18 120 22 Q140 26 160 22 Q180 18 200 22 Q220 26 240 22 Q260 18 280 22 Q300 26 320 22 Q340 18 360 22 Q380 26 400 22 L400 45 L0 45Z" fill="#42A5F5"/>
<path d="M0 33 Q50 30 100 33 Q150 36 200 33 Q250 30 300 33 Q350 36 400 33 L400 45 L0 45Z" fill="#EDD9A3"/>
</svg>
  </div>
  <div class="toolbar" id="toolbar">
    <span class="ulbl">As:</span>
    <button class="pencilbtn" onclick="openRenameTrip()" title="Rename trip"><i class="ti ti-pencil"></i></button>
    <span id="tripName" style="font-size:.58rem;color:#888;white-space:nowrap;margin-left:.2rem"></span>
  </div>
  <div class="nav" id="nav"></div>
  <div id="panel"></div>
</div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>
<div class="cpanel" id="cpanel">
  <div class="cp-head">
    <span class="cp-title" id="cpTitle"></span>
    <button class="cp-close" onclick="closeAll()" type="button"><i class="ti ti-x"></i></button>
  </div>
  <div class="cp-body" id="cpBody"></div>
</div>
<div class="ctx" id="ctx"></div>
<div class="covr" id="covr" onclick="closeCon()"></div>
<div class="cmod" id="cmod">
  <div class="cmod-t" id="cmod-t"></div>
  <div class="cmod-m" id="cmod-m"></div>
  <div class="cmod-btns">
    <button class="cmod-cancel" onclick="closeCon()" type="button">Cancel</button>
    <button class="cmod-ok" id="cmod-ok" type="button">Confirm</button>
  </div>
</div>

var sb=supabase.createClient(SB_URL,SB_KEY,{realtime:{enabled:false}});

var FIDS={
  jmcr:'a1000000-0000-0000-0000-000000000001',
  matthews:'a2000000-0000-0000-0000-000000000002',
  silvermans:'a3000000-0000-0000-0000-000000000003'
};
var COLORS=[
  {bg:'#E8F5E9',ic:'#1B5E20'},{bg:'#E3F2FD',ic:'#0D47A1'},
  {bg:'#FCE4EC',ic:'#880E4F'},{bg:'#FFF3E0',ic:'#E65100'},
  {bg:'#F3E5F5',ic:'#4A148C'},{bg:'#E0F7FA',ic:'#006064'}
];

  fkey:null,fid:null,fname:null,user:null,member:null,
  tab:'ryan',sub:'Backpack',trip:null,
  members:[],allMembers:[],cats:[],items:[],
  flights:[],hotels:[],reserves:[],rsubs:[],companions:[]
};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDT(dt){if(!dt)return'-';return new Date(dt).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});}
function fmtD(dt){if(!dt)return'-';return new Date(dt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function past(dt){return dt&&new Date(dt)<new Date();}
function sdot(s){document.getElementById('sdot').className='sdot'+(s?' '+s:'');}
function col(m,i){return{bg:m.bg_color||COLORS[i%COLORS.length].bg,ic:m.icon_color||COLORS[i%COLORS.length].ic};}
function V(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function DR(l,v){return '<div class="drow"><span class="dlbl">'+l+'</span><span class="dval">'+esc(String(v||'-'))+'</span></div>';}

function showLoad(){
  document.getElementById('fscreen').classList.add('hide');
  document.getElementById('lscreen').classList.remove('hide');
  document.getElementById('app').style.display='none';
}
function showApp(){
  document.getElementById('fscreen').classList.add('hide');
  document.getElementById('lscreen').classList.add('hide');
  document.getElementById('app').style.display='block';
}
function showFam(){
  document.getElementById('fscreen').classList.remove('hide');
  document.getElementById('lscreen').classList.add('hide');
  document.getElementById('app').style.display='none';
}

function pickFamily(key){
  S.fkey=key;
  S.fid=FIDS[key];
  S.fname=key==='jmcr'?'JMCR':key==='matthews'?'Matthews':'Silvermans';
  S.tab=key==='jmcr'?'ryan':'family';
  S.user=null;S.member=null;
  S.rsubs.forEach(function(r){if(r._iv)clearInterval(r._iv);});
  S.rsubs=[];
  localStorage.setItem('fkey',key);
  showLoad();
  loadAll();
}
function switchFam(){
  S.rsubs.forEach(function(r){if(r._iv)clearInterval(r._iv);});
  S.rsubs=[];
  localStorage.removeItem('fkey');
  showFam();
}

function loadAll(){
  sb.from('members').select('*').eq('family_id',S.fid).order('display_order')
  .then(function(r){
    S.members=r.data||[];
    var pk=S.members.filter(function(m){return!m.is_subject;});
    S.user=pk[0]||null; S.member=pk[0]||null;
    sb.from('members').select('*,families(name)').order('family_id').order('display_order')
    .then(function(r2){
      S.allMembers=r2.data||[];
      sb.from('categories').select('*').eq('family_id',S.fid).order('display_order')
      .then(function(r3){
        S.cats=r3.data||[];
        sb.from('trips').select('*').eq('family_id',S.fid).eq('is_active',true).limit(1)
        .then(function(r4){
          S.trip=r4.data&&r4.data[0]||null;
          var p=S.trip?sb.from('checklist_items').select('*').eq('trip_id',S.trip.id):Promise.resolve({data:[]});
          p.then(function(r5){
            S.items=r5.data||[];
            sb.from('flights').select('*,flight_passengers(*,members(name,icon,icon_color))').order('departure_dt')
            .then(function(r6){
              S.flights=r6.data||[];
              sb.from('accommodations').select('*').order('check_in_dt')
              .then(function(r7){
                S.hotels=r7.data||[];
                sb.from('reservations').select('*').order('reservation_dt')
                .then(function(r8){
                  S.reserves=r8.data||[];
                  sb.from('app_state').select('*').eq('family_id',S.fid).limit(1)
                  .then(function(r9){
                    var as=r9.data&&r9.data[0];
                    if(as){
                      S.tab=S.fkey==='jmcr'?(as.active_tab||'ryan'):(as.active_tab==='ryan'?'family':(as.active_tab||'family'));
                      S.sub=as.active_sub||'Backpack';
                      var sm=S.members.find(function(m){return m.id===as.active_member;});
                      if(sm)S.member=sm;
                    }
                    var iv=setInterval(function(){
                      if(!S.trip)return;
                      sb.from('checklist_items').select('*').eq('trip_id',S.trip.id)
                      .then(function(rp){S.items=rp.data||[];renderPanel();updateProg();});
                    },10000);
                    S.rsubs.push({_iv:iv});
                    showApp();
                    render();
                  });
                });
              });
            });
          });
        });
      });
    });
  });
}

function render(){
  document.getElementById('hBadge').textContent=S.fname;
  document.getElementById('tripName').textContent=S.trip?S.trip.name:'';
  renderToolbar();renderNav();renderPanel();updateProg();
}

function renderToolbar(){
  var tb=document.getElementById('toolbar');
  document.querySelectorAll('.ubtn').forEach(function(b){b.remove();});
  var pencil=tb.querySelector('.pencilbtn');
  var pk=S.members.filter(function(m){return!m.is_subject;});
  pk.forEach(function(m,i){
    var c=col(m,i);
    var b=document.createElement('button');
    b.className='ubtn'+(S.user&&S.user.id===m.id?' active':'');
    b.style.borderColor=c.ic;b.style.color=c.ic;
    if(S.user&&S.user.id===m.id)b.style.background=c.bg;
    b.innerHTML='<span class="udot" style="background:'+c.ic+'"></span>'+esc(m.name);
    b.onclick=function(){S.user=m;renderToolbar();};
    pencil.before(b);
  });
}

function renderNav(){
  var nav=document.getElementById('nav');nav.innerHTML='';
  var isJ=S.fkey==='jmcr';
  var tabs=isJ
    ?[{id:'ryan',lbl:'Ryan',ico:'ti-bolt',cls:'t-ryan'},
      {id:'family',lbl:'Family',ico:'ti-users',cls:'t-family'},
      {id:'flight',lbl:'Flight',ico:'ti-plane',cls:'t-flight'},
      {id:'hotel',lbl:'Hotel',ico:'ti-building',cls:'t-hotel'},
      {id:'reservations',lbl:'Reserve',ico:'ti-calendar-event',cls:'t-reserve'}]
    :[{id:'family',lbl:'Family',ico:'ti-users',cls:'t-family'},
      {id:'flight',lbl:'Flight',ico:'ti-plane',cls:'t-flight'},
      {id:'hotel',lbl:'Hotel',ico:'ti-building',cls:'t-hotel'},
      {id:'reservations',lbl:'Reserve',ico:'ti-calendar-event',cls:'t-reserve'}];
  tabs.forEach(function(t){
    var btn=document.createElement('button');
    btn.className='ntab '+t.cls+(S.tab===t.id?' active':'');
    btn.innerHTML='<i class="ti '+t.ico+' ntab-ico"></i><span class="ntab-lbl">'+t.lbl+'</span><span class="ntab-cnt">'+tabCnt(t.id)+'</span>';
    btn.onclick=function(){S.tab=t.id;saveAS();renderNav();renderPanel();};
    nav.appendChild(btn);
  });
}

function tabCnt(tab){
  if(tab==='ryan'){
    var cat=S.cats.find(function(c){return c.name===S.sub;});
    if(!cat)return'0/0';
    var its=S.items.filter(function(i){return i.category_id===cat.id&&!i.is_skipped;});
    return its.filter(function(i){return i.is_done;}).length+'/'+its.length;
  }
  if(tab==='family')return S.items.filter(function(i){return i.member_id&&!i.is_skipped;}).length;
  if(tab==='flight')return S.flights.filter(function(f){return!past(f.departure_dt);}).length;
  if(tab==='hotel')return S.hotels.filter(function(h){return!past(h.check_out_dt);}).length;
  if(tab==='reservations')return S.reserves.filter(function(r){return!past(r.reservation_dt);}).length;
  return 0;
}

function renderPanel(){
  var el=document.getElementById('panel');
  if(S.tab==='ryan')el.innerHTML=ryanPanel();
  else if(S.tab==='family')el.innerHTML=famPanel();
  else if(S.tab==='flight')el.innerHTML=flightPanel();
  else if(S.tab==='hotel')el.innerHTML=hotelPanel();
  else el.innerHTML=reservePanel();
  // bind checklist checkboxes
  document.querySelectorAll('.ichk').forEach(function(btn){
    btn.onclick=function(){toggleCheck(btn.dataset.id);};
  });
  document.querySelectorAll('.iundo').forEach(function(btn){
    btn.onclick=function(){undoCheck(btn.dataset.id);};
  });
  document.querySelectorAll('.idot').forEach(function(btn){
    btn.onclick=function(e){itemCtx(e,btn.dataset.id,btn.dataset.tab);};
  });
}

function sorted(arr){
  var a=arr.filter(function(i){return!i.is_done&&!i.is_skipped;}).sort(function(a,b){return a.text.localeCompare(b.text);});
  var s=arr.filter(function(i){return i.is_skipped;}).sort(function(a,b){return a.text.localeCompare(b.text);});
  var d=arr.filter(function(i){return i.is_done;}).sort(function(a,b){return a.text.localeCompare(b.text);});
  return a.concat(s,d);
}

function irow(item,tab){
  var st=S.allMembers.find(function(m){return m.id===item.done_by;});
  var stamp=st?'<span class="istamp" style="background:'+((st.icon_color||'#ccc')+'22')+';color:'+(st.icon_color||'#555')+'">'+esc(st.name)+'</span>':'';
  var skip=item.is_skipped?'<span class="iskip">skip</span>':'';
  var undo=item.is_done?'<button class="iundo" data-id="'+item.id+'">Undo</button>':'';
  return '<li class="irow'+(item.is_done?' done':'')+(item.is_skipped?' skip':'')+'">'
    +'<button class="ichk'+(item.is_done?' on':'')+'" data-id="'+item.id+'">'+(item.is_done?'<i class="ti ti-check"></i>':'')+'</button>'
    +'<div style="flex:1;min-width:0"><div class="itxt'+(item.is_done?' struck':'')+(item.is_skipped?' skp':'')+'">'+esc(item.text)+'</div>'+undo+'</div>'
    +stamp+skip
    +'<button class="idot" data-id="'+item.id+'" data-tab="'+tab+'"><i class="ti ti-dots-vertical"></i></button>'
    +'</li>';
}

function ryanPanel(){
  var defs=[{n:'Backpack',ico:'ti-backpack',c:'#085041'},{n:'Meds',ico:'ti-pill',c:'#712B13'},{n:'Equip',ico:'ti-stethoscope',c:'#0C447C'}];
  var cur=defs.find(function(d){return d.n===S.sub;})||defs[0];
  var cat=S.cats.find(function(c){return c.name===S.sub;});
  var items=cat?sorted(S.items.filter(function(i){return i.category_id===cat.id;})):[];
  var done=items.filter(function(i){return i.is_done;}).length;
  var tot=items.filter(function(i){return!i.is_skipped;}).length;

  // build dropdown items using createElement to avoid ALL quote issues
  var dropHtml='';
  defs.forEach(function(d){
    var sc=S.cats.find(function(c){return c.name===d.n;});
    var sd=sc?S.items.filter(function(i){return i.category_id===sc.id&&i.is_done;}).length:0;
    var st=sc?S.items.filter(function(i){return i.category_id===sc.id&&!i.is_skipped;}).length:0;
    var sel=S.sub===d.n;
    dropHtml+='<div class="dditem'+(sel?' sel':'')+'" data-sub="'+d.n+'">'
      +'<i class="ti '+d.ico+' dditem-ico" style="color:'+d.c+'"></i>'
      +'<span>'+d.n+'</span>'
      +'<span class="dditem-cnt">'+sd+'/'+st+'</span>'
      +'</div>';
  });

  var rows='';
  items.forEach(function(i){rows+=irow(i,'ryan');});

  return '<div class="ddwrap">'
    +'<div style="display:flex;align-items:center;background:#DAEEF9;border-bottom:2px solid #7F77DD">'
    +'<button class="ddsel" id="ryanSelBtn" type="button" style="flex:1;background:transparent;border:none;border-bottom:none">'
    +'<i class="ti '+cur.ico+' ddsel-ico" style="color:'+cur.c+'"></i>'
    +'<span class="ddsel-lbl">Ryan &mdash; '+esc(S.sub)+'</span>'
    +'<span class="ddsel-cnt">'+done+'/'+tot+'</span>'
    +'<i class="ti ti-chevron-down ddarrow" id="ryanDDArr"></i>'
    +'</button>'
    +'<button class="ph-add" style="background:#7F77DD;margin-right:.5rem" id="addRyanBtn" type="button"><i class="ti ti-plus"></i> Add</button>'
    +'</div>'
    +'<div class="ddmenu" id="ryanDD">'+dropHtml+'</div>'
    +'</div>'
    +'<ul class="ilist">'+rows+'</ul>'
    +(items.length?'':'<div class="empty">No items yet</div>');
}

function famPanel(){
  var m=S.member;
  var pk=S.members.filter(function(p){return!p.is_subject;});

  var dropHtml='';
  pk.forEach(function(p,i){
    var c=col(p,i);
    var pd=S.items.filter(function(x){return x.member_id===p.id&&x.is_done;}).length;
    var pt=S.items.filter(function(x){return x.member_id===p.id&&!x.is_skipped;}).length;
    var sel=m&&m.id===p.id;
    dropHtml+='<div class="dditem'+(sel?' selfam':'')+'" data-mid="'+p.id+'"'
      +' style="'+(sel?'background:'+c.bg+';':'')+'">'
      +'<i class="ti '+(p.icon||'ti-user')+' dditem-ico" style="color:'+c.ic+'"></i>'
      +'<span>'+esc(p.name)+'</span>'
      +'<span class="dditem-cnt" style="background:'+c.ic+'22;color:'+c.ic+'">'+pd+'/'+pt+'</span>'
      +'</div>';
  });

  var mi=m?pk.indexOf(m):0;
  var mc=col(m||pk[0]||{},mi<0?0:mi);
  var done=m?S.items.filter(function(i){return i.member_id===m.id&&i.is_done;}).length:0;
  var tot=m?S.items.filter(function(i){return i.member_id===m.id&&!i.is_skipped;}).length:0;

  var html='<div class="ddwrap">'
    +'<div style="display:flex;align-items:center;background:'+mc.bg+';border-bottom:2px solid '+mc.ic+'">'
    +'<button class="ddsel" id="famSelBtn" type="button" style="flex:1;background:transparent;border:none;border-bottom:none">'
    +(m?'<i class="ti '+(m.icon||'ti-user')+' ddsel-ico" style="color:'+mc.ic+'"></i>':'<i class="ti ti-users ddsel-ico"></i>')
    +'<span class="ddsel-lbl">'+(m?esc(m.name)+"'s List":'Select person')+'</span>'
    +(m?'<span class="ddsel-cnt fam">'+done+'/'+tot+'</span>':'')
    +'<i class="ti ti-chevron-down ddarrow" id="famDDArr"></i>'
    +'</button>'
    +'<button class="ph-add" style="background:'+mc.ic+';margin-right:.5rem" id="addFamBtn" type="button"><i class="ti ti-plus"></i> Add</button>'
    +'</div>'
    +'<div class="ddmenu" id="famDD">'+dropHtml+'</div>'
    +'</div>';

  if(!m)return html+'<div class="empty">Select a family member above</div>';

  var items=sorted(S.items.filter(function(i){return i.member_id===m.id;}));
  var rows='';items.forEach(function(i){rows+=irow(i,'family');});

  return html
    +'<ul class="ilist" style="background:'+mc.bg+'18">'+rows+'</ul>'
    +(items.length?'':'<div class="empty">No items yet</div>');
}

function flightPanel(){
  var srt=S.flights.slice().sort(function(a,b){return new Date(a.departure_dt)-new Date(b.departure_dt);});
  var up=srt.filter(function(f){return!past(f.departure_dt);});
  var old=srt.filter(function(f){return past(f.departure_dt);});
  function fc(f){
    var pax=(f.flight_passengers||[]).map(function(p){return(p.members&&p.members.name)||p.companion_name;}).filter(Boolean).join(', ');
    return '<div class="card'+(past(f.departure_dt)?' past':'')+'" data-fid="'+f.id+'">'
      +'<div class="card-title">'+esc(f.origin_city)+' &rarr; '+esc(f.dest_city)+'</div>'
      +'<div class="card-sub"><span class="pill fl">'+esc(f.airline||'-')+'</span>'+fmtDT(f.departure_dt)+(f.gate?' &middot; Gate '+esc(f.gate):'')+'</div>'
      +(pax?'<div class="card-sub" style="margin-top:.15rem">'+esc(pax)+'</div>':'')
      +'<i class="ti ti-chevron-right card-chev"></i></div>';
  }
  var cards=up.map(fc).join('');
  if(old.length)cards+='<div class="secsep">Past</div>'+old.map(fc).join('');
  return '<div class="addbar" style="background:#E6F1FB;border-bottom:2px solid #378ADD">'
    +'<span style="font-size:.78rem;font-weight:600;color:#0C447C">Flights</span>'
    +'<button class="ph-add" style="background:#378ADD" id="addFlightBtn"><i class="ti ti-plus"></i> Add</button>'
    +'</div>'
    +(up.length+old.length?'<div class="cards">'+cards+'</div>':'<div class="empty">No flights yet</div>');
}

    +'<span style="font-size:.78rem;font-weight:600;color:#712B13">Hotels &amp; Stays</span>'
    +'<button class="ph-add" style="background:#D85A30" id="addHotelBtn"><i class="ti ti-plus"></i> Add</button>'

function updateProg(){
  if(S.fkey!=='jmcr'){document.getElementById('pl').textContent='';return;}
  var ci=S.cats.map(function(c){return c.id;});
  var ry=S.members.find(function(m){return m.is_subject;});
  var ri=S.items.filter(function(i){return ci.indexOf(i.category_id)>=0||(ry&&i.member_id===ry.id);});
  var tot=ri.filter(function(i){return!i.is_skipped;}).length;
  var dn=ri.filter(function(i){return i.is_done;}).length;
  var pct=tot?Math.round(dn/tot*100):0;
  document.getElementById('pb').style.width=pct+'%';
  document.getElementById('pl').textContent="Ryan: "+dn+"/"+tot+" ("+pct+"%)";
}

// ── DROPDOWN - attached after renderPanel via event delegation on panel ──
document.addEventListener('click',function(e){
  // Close ctx menu
  if(!e.target.closest('#ctx')&&!e.target.closest('.idot')){
    document.getElementById('ctx').classList.remove('open');
  }
  // Close dropdowns when clicking outside
  if(!e.target.closest('.ddwrap')){
    document.querySelectorAll('.ddmenu.open').forEach(function(m){m.classList.remove('open');});
    document.querySelectorAll('.ddarrow.open').forEach(function(a){a.classList.remove('open');});
  }
  // Ryan dropdown toggle
  var rBtn=e.target.closest('#ryanSelBtn');
  if(rBtn){
    var m=document.getElementById('ryanDD');
    var a=document.getElementById('ryanDDArr');
    if(m){
      var wasOpen=m.classList.contains('open');
      m.classList.toggle('open');
      if(a)a.classList.toggle('open',!wasOpen);
    }
    return;
  }
  // Family dropdown toggle
  var fBtn=e.target.closest('#famSelBtn');
  if(fBtn){
    var m=document.getElementById('famDD');
    var a=document.getElementById('famDDArr');
    if(m){
      var wasOpen=m.classList.contains('open');
      m.classList.toggle('open');
      if(a)a.classList.toggle('open',!wasOpen);
    }
    return;
  }
  // Ryan sub selection
  var rItem=e.target.closest('#ryanDD .dditem');
  if(rItem&&rItem.dataset.sub){
    S.sub=rItem.dataset.sub;
    document.getElementById('ryanDD').classList.remove('open');
    var ra=document.getElementById('ryanDDArr');if(ra)ra.classList.remove('open');
    saveAS();renderNav();renderPanel();
    return;
  }
  // Family member selection
  var fItem=e.target.closest('#famDD .dditem');
  if(fItem&&fItem.dataset.mid){
    S.member=S.members.find(function(m){return m.id===fItem.dataset.mid;})||null;
    document.getElementById('famDD').classList.remove('open');
    var fa=document.getElementById('famDDArr');if(fa)fa.classList.remove('open');
    saveAS();renderPanel();
    return;
  }
  // Add buttons
  if(e.target.closest('#addRyanBtn')){openAddItem('ryan');return;}
  if(e.target.closest('#addFamBtn')){openAddItem('family');return;}
  if(e.target.closest('#addFlightBtn')){openAddFlight();return;}
  if(e.target.closest('#addHotelBtn')){openAddHotel(null);return;}
  if(e.target.closest('#addReserveBtn')){openAddReservation(null);return;}
  // Flight/hotel/reserve cards
  var fc=e.target.closest('[data-fid]');if(fc){flightDetail(fc.dataset.fid);return;}
  var hc=e.target.closest('[data-hid]');if(hc){hotelDetail(hc.dataset.hid);return;}
  var rc=e.target.closest('[data-rid]');if(rc){reserveDetail(rc.dataset.rid);return;}
});

// ── CHECKLIST ──
function toggleCheck(id){
  sdot('saving');
  var item=S.items.find(function(i){return i.id===id;});if(!item)return;
  var nd=!item.is_done;
  sb.from('checklist_items').update({is_done:nd,done_by:nd?(S.user&&S.user.id||null):null,done_at:nd?new Date().toISOString():null,is_skipped:false}).eq('id',id)
  .then(function(r){
    if(r.error){sdot('err');return;}
    item.is_done=nd;item.done_by=nd?(S.user&&S.user.id||null):null;item.is_skipped=false;
    sdot('');renderPanel();updateProg();
  });
}
function undoCheck(id){
  sdot('saving');
  sb.from('checklist_items').update({is_done:false,done_by:null,done_at:null}).eq('id',id)
  .then(function(r){
    if(r.error){sdot('err');return;}
    var item=S.items.find(function(i){return i.id===id;});
    if(item){item.is_done=false;item.done_by=null;}
    sdot('');renderPanel();updateProg();
  });
}
function skipItem(id){
  sdot('saving');
  var item=S.items.find(function(i){return i.id===id;});if(!item)return;
  var ns=!item.is_skipped;
  sb.from('checklist_items').update({is_skipped:ns,is_done:false,done_by:null,done_at:null}).eq('id',id)
  .then(function(r){
    if(r.error){sdot('err');return;}
    item.is_skipped=ns;item.is_done=false;
    sdot('');closeCtx();renderPanel();updateProg();
  });
}
function deleteItem(id){
  sdot('saving');
  sb.from('checklist_items').delete().eq('id',id)
  .then(function(r){
    if(r.error){sdot('err');return;}
    S.items=S.items.filter(function(i){return i.id!==id;});
    sdot('');closeCtx();renderPanel();updateProg();
  });
}
function itemCtx(e,id,tab){
  e.stopPropagation();
  var item=S.items.find(function(i){return i.id===id;});if(!item)return;
  var ctx=document.getElementById('ctx');
  ctx.innerHTML='<button class="cxi" onclick="skipItem(\''+id+'\')">'+(item.is_skipped?'Unskip':'Skip')+'</button>'
    +(item.is_done?'<button class="cxi" onclick="undoCheck(\''+id+'\');closeCtx()">Undo check</button>':'')
    +'<div class="cxd"></div>'
    +'<button class="cxi red" onclick="deleteItem(\''+id+'\')">Delete</button>';
  ctx.style.top=Math.min(e.clientY+4,window.innerHeight-130)+'px';
  ctx.style.left=Math.min(e.clientX,window.innerWidth-160)+'px';
  ctx.classList.add('open');
}
function closeCtx(){document.getElementById('ctx').classList.remove('open');}

function submitAdd(tab){
  var text=V('addTxt');if(!text){alert('Enter an item.');return;}
  if(!S.trip){alert('No active trip.');return;}
  sdot('saving');
  var rows=[];
  if(tab==='ryan'){
    var sub=S._pendingSub||S.sub;
    var cat=S.cats.find(function(c){return c.name===sub;});
    if(!cat){alert('Category not found.');sdot('err');return;}
    rows.push({trip_id:S.trip.id,category_id:cat.id,text:text,created_by:S.user&&S.user.id||null});
  }else{

  .then(function(r){

function paxTiles(selIds){
  var groups={};var order=[];
  (S.allMembers||[]).forEach(function(m){
    if(!groups[m.family_id]){groups[m.family_id]={name:(m.families&&m.families.name)||m.family_id,mems:[]};order.push(m.family_id);}
    groups[m.family_id].mems.push(m);
  });
  var html='';
  order.forEach(function(fid){
    var g=groups[fid];var isCur=fid===S.fid;
    var tiles='';
    g.mems.forEach(function(m,i){
      var c=col(m,i);var isSel=selIds?selIds.indexOf(m.id)>=0:isCur;
      tiles+='<div class="mtile'+(isSel?' sel':'')+'" data-mid="'+m.id+'" style="border-color:'+(isSel?c.ic:'#e0d8c8')+'" onclick="this.classList.toggle(\'sel\');this.style.borderColor=this.classList.contains(\'sel\')?\''+c.ic+'\':\'#e0d8c8\'">'
        +'<i class="ti '+(m.icon||'ti-user')+'" style="color:'+c.ic+'"></i>'
        +'<span style="font-size:.5rem;font-weight:600">'+esc(m.name)+'</span></div>';
    });
    html+='<div class="fam-group"><span class="fam-group-lbl">'+g.name+(isCur?' (you)':'')+'</span><div class="mtiles">'+tiles+'</div></div>';
  });
  return html;
}
function seatRows(members,pax){

      +'<span style="font-size:.68rem;width:4rem;flex-shrink:0">'+esc(m.name)+'</span>'
      +'<input class="finp" data-seat="'+m.id+'" value="'+(s&&s.seat?esc(s.seat):'')+'" placeholder="Seat" style="flex:1"/></div>';
  }).join('');
}

function submitFlight(editId){
  var from=V('fFrom'),to=V('fTo'),dep=V('fDep');
  if(!from||!to||!dep){alert('From, To and Departure required.');return;}
  sdot('saving');
  var insEl=document.querySelector('#insTog .on');
  var isIns=insEl&&insEl.textContent.trim()==='Yes';
  var row={trip_id:S.trip&&S.trip.id||null,origin_city:from,dest_city:to,
    departure_dt:new Date(dep).toISOString(),arrival_dt:V('fArr')?new Date(V('fArr')).toISOString():null,
    airline:V('fAl')||null,flight_number:V('fNum')||null,gate:V('fGate')||null,
    confirmation_no:V('fConf')||null,is_insured:isIns,
    insurance_policy_no:isIns?(V('fPol')||null):null,
    notes:V('fNotes')||null,entered_by:S.user&&S.user.id||null};
  var isNew=!editId||editId==='null';
  var p=isNew?sb.from('flights').insert(row).select().single():sb.from('flights').update(row).eq('id',editId);
  p.then(function(rd){
    if(rd.error){sdot('err');console.error(rd.error);return;}
    var fid=isNew?rd.data.id:editId;
    sb.from('flight_passengers').delete().eq('flight_id',fid).then(function(){
      var paxRows=[];
      getSelPax('#fpaxTiles').forEach(function(mid){
        var se=document.querySelector('[data-seat="'+mid+'"]');
        paxRows.push({flight_id:fid,member_id:mid,seat:se?se.value.trim()||null:null,is_companion:false});
      });
      S.companions.forEach(function(c){paxRows.push({flight_id:fid,companion_name:c.name,seat:c.seat||null,is_companion:true});});
      var ip=paxRows.length?sb.from('flight_passengers').insert(paxRows):Promise.resolve({});
      ip.then(function(){
        S.companions=[];
        sb.from('flights').select('*,flight_passengers(*,members(name,icon,icon_color))').order('departure_dt')
        .then(function(r){S.flights=r.data||[];sdot('');closeAll();renderPanel();});
      });
    });
  });
}

  var r=S.reserves.find(function(x){return x.id===id;});if(!r)return;
  openCP(esc(r.name),DR('Type',r.res_type)+DR('Name',r.name)+DR('When',fmtDT(r.reservation_dt))
    +DR('Location',r.location)+DR('People',r.num_people)+DR('Confirmation',r.confirmation_no)+DR('Notes',r.notes)
    +'<button class="sbtn reserve" type="button" onclick="openAddReservation(S.reserves.find(function(x){return x.id===\''+r.id+'\';}))">Edit</button>'
    +'<button class="dbtn" type="button" onclick="delRec(\'reserve\',\''+r.id+'\')">Delete</button>');
}

// ── DELETE ──
function delRec(type,id){
  if(!confirm('Delete this '+type+'?'))return;sdot('saving');
  var tbl={flight:'flights',hotel:'accommodations',reserve:'reservations'};
  sb.from(tbl[type]).delete().eq('id',id).then(function(){
    if(type==='flight')sb.from('flights').select('*,flight_passengers(*,members(name,icon,icon_color))').order('departure_dt').then(function(r){S.flights=r.data||[];sdot('');closeAll();renderPanel();});
    else if(type==='hotel')sb.from('accommodations').select('*').order('check_in_dt').then(function(r){S.hotels=r.data||[];sdot('');closeAll();renderPanel();});
    else sb.from('reservations').select('*').order('reservation_dt').then(function(r){S.reserves=r.data||[];sdot('');closeAll();renderPanel();});
  });
}

// ── NEW TRIP ──
function openNewTrip(){
  openConfirm('New Trip?','Checklist items stay but are unchecked. Flights, hotels and reservations are cleared.',function(){
    var n=V('newTripName')||'My Trip';
    sdot('saving');
    sb.rpc('start_new_trip',{p_family_id:S.fid,p_trip_name:n}).then(function(r){
      if(r.error){sdot('err');console.error(r.error);return;}
      S.trip=null;closeCon();sdot('');loadAll();
    });
  },'<input class="finp" id="newTripName" placeholder="e.g. Cruise 2027" style="margin-top:.5rem;width:100%"/>');
}
function openRenameTrip(){
  if(!S.trip)return;
  openCP('Rename Trip','<div class="fsec"><label class="flbl">Name</label><input class="finp" id="tripRenIn" value="'+esc(S.trip.name)+'"/></div><button class="sbtn flight" type="button" onclick="saveRename()">Save</button>');
}
function saveRename(){
  var v=V('tripRenIn');if(!v)return;sdot('saving');
  sb.rpc('rename_trip',{p_family_id:S.fid,p_new_name:v}).then(function(){
    if(S.trip)S.trip.name=v;
    document.getElementById('tripName').textContent=v;
    sdot('');closeAll();
  });
}
function saveAS(){
  sb.from('app_state').upsert({family_id:S.fid,active_tab:S.tab,active_sub:S.sub,
    active_member:S.member&&S.member.id||null,updated_at:new Date().toISOString()},{onConflict:'family_id'});
}

// ── UI HELPERS ──
function openCP(title,body){
  document.getElementById('cpTitle').textContent=title;
  document.getElementById('cpBody').innerHTML=body;
  document.getElementById('cpanel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('cpanel').scrollTop=0;
}
function openConfirm(title,msg,onOk,extra){
  document.getElementById('cmod-t').textContent=title;
  document.getElementById('cmod-m').innerHTML=msg+(extra||'');
  document.getElementById('cmod-ok').onclick=onOk;
  document.getElementById('cmod').classList.add('open');
  document.getElementById('covr').classList.add('open');
}
function closeCon(){
  document.getElementById('cmod').classList.remove('open');
  document.getElementById('covr').classList.remove('open');
}
function closeAll(){
  document.getElementById('cpanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('ctx').classList.remove('open');
}

// ── BOOT ──
(function(){
  var saved=localStorage.getItem('fkey');
  if(saved&&FIDS[saved])pickFamily(saved);
}());

</script>
